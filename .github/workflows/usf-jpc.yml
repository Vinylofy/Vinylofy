name: USF - JPC

on:
  schedule:
    # Elke 2 uur een listingpagina-shard; 24 shards = volledige page-cyclus binnen 48 uur.
    - cron: "17 */2 * * *"
    # Tijdelijke detailburst: 4x per dag 500 missende EAN-detailpagina's.
    - cron: "47 1,7,13,19 * * *"
  workflow_dispatch:
    inputs:
      routes:
        description: "JPC routes: default of comma-separated name=url specs"
        required: true
        default: "default"
        type: string
      include_route_index:
        description: "Ook de JPC vinyl-home uitlezen als route-index"
        required: true
        default: true
        type: boolean
      max_pages_per_route:
        description: "Aantal listingpagina's per route; 0 = tot stopconditie"
        required: true
        default: "1"
        type: string
      route_shard_index:
        description: "Route shard index, 0-based"
        required: true
        default: "0"
        type: string
      route_shard_count:
        description: "Aantal route shards"
        required: true
        default: "1"
        type: string
      pagination_fallback:
        description: "Fallback pagination; ff gebruikt /ff/<cid>?page=N"
        required: true
        default: "ff"
        type: choice
        options:
          - "ff"
          - "none"
          - "page"
          - "pn"
      discovery_sleep:
        description: "Wachttijd tussen JPC listingpagina's"
        required: true
        default: "4.0"
        type: string
      requeue_stale_hours:
        description: "Minimale ouderdom voor JPC detailrefresh"
        required: true
        default: "72"
        type: string
      requeue_limit:
        description: "Maximaal aantal stale links requeueen"
        required: true
        default: "250"
        type: string
      requeue_target_queue:
        description: "Queue maximaal aanvullen tot dit aantal"
        required: true
        default: "500"
        type: string
      detail_limit:
        description: "Maximaal aantal JPC detail/EAN-lookups"
        required: true
        default: "100"
        type: string
      detail_sleep:
        description: "Wachttijd tussen JPC detailpagina's"
        required: true
        default: "4.0"
        type: string
      sync_listing_prices:
        description: "Listingprijzen naar bestaande JPC public.prices syncen"
        required: true
        default: false
        type: boolean
      price_sync_limit:
        description: "Maximaal aantal JPC listinglinks voor price-sync"
        required: true
        default: "200000"
        type: string
      stage_limit:
        description: "Maximaal aantal raw snapshots naar staged_offers"
        required: true
        default: "100"
        type: string
      promote_limit:
        description: "Maximaal aantal staged offers promoveren"
        required: true
        default: "100"
        type: string
      quarantine_limit:
        description: "Maximaal aantal promote errors quarantinen"
        required: true
        default: "100"
        type: string
      discovery_write:
        description: "Alleen JPC discovered links naar shop_product_links schrijven"
        required: true
        default: false
        type: boolean
      requeue_write:
        description: "Alleen stale JPC links opnieuw in detailqueue zetten"
        required: true
        default: false
        type: boolean
      detail_write:
        description: "Alleen JPC detail/EAN-resultaten naar raw_shop_scrapes schrijven"
        required: true
        default: false
        type: boolean
      price_sync_write:
        description: "Alleen bestaande JPC public.prices vanuit listingprijzen bijwerken"
        required: true
        default: false
        type: boolean
      stage_write:
        description: "Alleen JPC raw snapshots naar staged_offers schrijven"
        required: true
        default: false
        type: boolean
      promote_write:
        description: "Alleen JPC staged offers naar publieke tabellen promoveren"
        required: true
        default: false
        type: boolean
      quarantine_write:
        description: "Alleen JPC promote errors quarantinen"
        required: true
        default: false
        type: boolean
      write:
        description: "Alle JPC databasewrites uitvoeren; overschrijft losse write-flags"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: usf-jpc-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate JPC USF pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-scrapers.txt ]; then pip install -r requirements-scrapers.txt; fi
          pip install requests beautifulsoup4 "psycopg[binary]" python-dotenv

      - name: Compile JPC USF modules
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/scrapers/usf/core/db.py \
            scripts/scrapers/usf/core/link_registry.py \
            scripts/scrapers/usf/core/staging.py \
            scripts/scrapers/usf/core/promotion.py \
            scripts/scrapers/usf/core/promotion_writer.py \
            scripts/scrapers/usf/core/quarantine.py \
            scripts/scrapers/usf/jobs/discover_jpc_vinyl.py \
            scripts/scrapers/usf/jobs/detail_jpc.py \
            scripts/scrapers/usf/jobs/sync_jpc_listing_prices.py \
            scripts/scrapers/usf/jobs/stage_jpc.py \
            scripts/scrapers/usf/jobs/promote_jpc.py \
            scripts/scrapers/usf/jobs/quarantine_jpc.py \
            scripts/scrapers/usf/jobs/run_jpc_pipeline.py

      - name: Validate command-line interfaces
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.scrapers.usf.jobs.discover_jpc_vinyl --help
          python -m scripts.scrapers.usf.jobs.detail_jpc --help
          python -m scripts.scrapers.usf.jobs.sync_jpc_listing_prices --help
          python -m scripts.scrapers.usf.jobs.stage_jpc --help
          python -m scripts.scrapers.usf.jobs.promote_jpc --help
          python -m scripts.scrapers.usf.jobs.quarantine_jpc --help
          python -m scripts.scrapers.usf.jobs.run_jpc_pipeline --help
          python scripts/scrapers/usf/tests/test_jpc_pipeline_contract.py

  run:
    name: Run JPC USF pipeline
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-scrapers.txt ]; then pip install -r requirements-scrapers.txt; fi
          pip install requests beautifulsoup4 "psycopg[binary]" python-dotenv

      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          if not os.environ.get("DATABASE_URL"):
              raise SystemExit("[ERROR] GitHub secret DATABASE_URL ontbreekt")
          print("[CONFIG] DATABASE_URL is ingesteld")
          PY

      - name: Run JPC USF pipeline
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          DETAIL_BURST_START_DATE: "2026-08-31"
          DETAIL_BURST_END_DATE_EXCLUSIVE: "2026-09-28"
        run: |
          set -euo pipefail
          mkdir -p output/usf-jpc

          if [ "$EVENT_NAME" = "schedule" ] && [ "$EVENT_SCHEDULE" = "17 */2 * * *" ]; then
            SHARD_COUNT=24
            SHARD_INDEX=$(( ($(date -u +%s) / 7200) % SHARD_COUNT ))

            COMMAND=(
              python -u -m scripts.scrapers.usf.jobs.run_jpc_pipeline
              --routes default
              --include-route-index
              --max-pages-per-route 0
              --listing-page-shard-index "$SHARD_INDEX"
              --listing-page-shard-count "$SHARD_COUNT"
              --pagination-fallback ff
              --discovery-sleep 2.0
              --discovery-write
              --sync-listing-prices
              --price-sync-limit 200000
              --price-sync-write
              --skip-requeue
              --skip-detail
              --skip-stage
              --skip-promote
              --skip-quarantine
            )
          elif [ "$EVENT_NAME" = "schedule" ] && [ "$EVENT_SCHEDULE" = "47 1,7,13,19 * * *" ]; then
            TODAY=$(date -u +%F)
            if [[ "$TODAY" < "$DETAIL_BURST_START_DATE" || "$TODAY" > "$DETAIL_BURST_END_DATE_EXCLUSIVE" || "$TODAY" = "$DETAIL_BURST_END_DATE_EXCLUSIVE" ]]; then
              echo "[WORKFLOW] JPC detailburst buiten datumvenster: today=$TODAY start=$DETAIL_BURST_START_DATE end_exclusive=$DETAIL_BURST_END_DATE_EXCLUSIVE"
              exit 0
            fi

            COMMAND=(
              python -u -m scripts.scrapers.usf.jobs.run_jpc_pipeline
              --skip-discovery
              --skip-requeue
              --detail-limit 500
              --detail-sleep 4.0
              --detail-write
              --stage-limit 500
              --stage-write
              --promote-limit 500
              --promote-write
              --quarantine-limit 500
              --quarantine-write
            )
          else
            COMMAND=(
              python -u -m scripts.scrapers.usf.jobs.run_jpc_pipeline
              --routes "${{ inputs.routes }}"
              --max-pages-per-route "${{ inputs.max_pages_per_route }}"
              --route-shard-index "${{ inputs.route_shard_index }}"
              --route-shard-count "${{ inputs.route_shard_count }}"
              --pagination-fallback "${{ inputs.pagination_fallback }}"
              --discovery-sleep "${{ inputs.discovery_sleep }}"
              --requeue-stale-hours "${{ inputs.requeue_stale_hours }}"
              --requeue-limit "${{ inputs.requeue_limit }}"
              --requeue-target-queue "${{ inputs.requeue_target_queue }}"
              --detail-limit "${{ inputs.detail_limit }}"
              --detail-sleep "${{ inputs.detail_sleep }}"
              --price-sync-limit "${{ inputs.price_sync_limit }}"
              --stage-limit "${{ inputs.stage_limit }}"
              --promote-limit "${{ inputs.promote_limit }}"
              --quarantine-limit "${{ inputs.quarantine_limit }}"
            )

            if [ "${{ inputs.include_route_index }}" = "true" ]; then
              COMMAND+=(--include-route-index)
            fi

            if [ "${{ inputs.sync_listing_prices }}" = "true" ]; then
              COMMAND+=(--sync-listing-prices)
            fi

            if [ "${{ inputs.discovery_write }}" = "true" ]; then
              COMMAND+=(--discovery-write)
            fi

            if [ "${{ inputs.requeue_write }}" = "true" ]; then
              COMMAND+=(--requeue-write)
            fi

            if [ "${{ inputs.detail_write }}" = "true" ]; then
              COMMAND+=(--detail-write)
            fi

            if [ "${{ inputs.price_sync_write }}" = "true" ]; then
              COMMAND+=(--price-sync-write)
            fi

            if [ "${{ inputs.stage_write }}" = "true" ]; then
              COMMAND+=(--stage-write)
            fi

            if [ "${{ inputs.promote_write }}" = "true" ]; then
              COMMAND+=(--promote-write)
            fi

            if [ "${{ inputs.quarantine_write }}" = "true" ]; then
              COMMAND+=(--quarantine-write)
            fi

            if [ "${{ inputs.write }}" = "true" ]; then
              COMMAND+=(--write)
            fi
          fi

          printf '[WORKFLOW] JPC command:'
          printf ' %q' "${COMMAND[@]}"
          printf '\n'

          "${COMMAND[@]}" 2>&1 | tee output/usf-jpc/pipeline.log

      - name: Upload JPC logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usf-jpc-logs
          path: output/usf-jpc/
          if-no-files-found: ignore
