name: Apply record label shop type once

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: record-label-shop-type-production
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install database driver
        run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Preflight, migrate, and verify
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          import psycopg

          db_url = os.environ.get('DATABASE_URL', '')
          if not db_url:
              raise SystemExit('DATABASE_URL is missing')

          sql = Path('supabase/migrations/20260927140000_add_record_label_shop_type.sql').read_text()
          if hashlib.sha256(sql.encode()).hexdigest() != 'e994a7f9565e22ef94e6ca3e201b60279920b91cb136c8bb08ca357727297f2b':
              raise SystemExit('Migration SQL differs from the reviewed file')

          def read_state():
              with psycopg.connect(
                  db_url,
                  options='-c default_transaction_read_only=on',
                  connect_timeout=15,
              ) as conn:
                  with conn.cursor() as cur:
                      cur.execute(
                          "select domain, is_active, shop_type from public.shops "
                          "where regexp_replace(lower(btrim(domain)), '^www[.]', '') = 'musiconvinyl.com'"
                      )
                      rows = cur.fetchall()
                      if len(rows) != 1 or not rows[0][1]:
                          raise SystemExit(f'Unsafe Music On Vinyl target set: {len(rows)} rows or inactive')
                      if rows[0][2] not in (None, 'record_label'):
                          raise SystemExit(f'Unexpected Music On Vinyl type: {rows[0][2]}')
                      cur.execute(
                          "select pg_get_constraintdef(oid) from pg_constraint "
                          "where conrelid = 'public.shops'::regclass "
                          "and conname = 'shops_shop_type_check'"
                      )
                      result = cur.fetchone()
                      if not result:
                          raise SystemExit('Shop type constraint is missing')
                      return rows[0][2], result[0]

          before, constraint = read_state()
          print(f'Preflight: one active Music On Vinyl row; type: {before}; record_label allowed: {"record_label" in constraint}')
          if before == 'record_label' and 'record_label' in constraint:
              print('Already applied; no database write')
          else:
              with psycopg.connect(db_url, autocommit=True, connect_timeout=15) as conn:
                  conn.execute(sql, prepare=False)
              print('Migration SQL committed')

          after, constraint = read_state()
          if after != 'record_label' or 'record_label' not in constraint:
              raise SystemExit('Postcondition failed')
          print('Postcondition: Music On Vinyl is record_label and constraint permits it')
          PY
