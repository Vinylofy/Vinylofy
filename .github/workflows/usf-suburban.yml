name: USF - Suburban

on:
  schedule:
    - cron: "20 3 * * *"
  pull_request:
    paths:
      - ".github/workflows/usf-suburban.yml"
      - "scripts/scrapers/suburban.py"
      - "scripts/scrapers/usf/jobs/refresh_suburban_listing_prices.py"
      - "scripts/importers/import_suburban.py"
      - "scripts/importers/registry.py"
      - "data/shipping/vinylofy_shipping_rules_nl.csv"
      - "tests/test_suburban_*.py"
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Aantal listingpagina's; 0 = doorgaan tot geen nieuwe URL's"
        required: true
        default: "2"
        type: string
      detail_limit:
        description: "Maximaal aantal detailpagina's"
        required: true
        default: "5"
        type: string
      write:
        description: "Voer de database-import uit; standaard alleen dry-run"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: vinylofy-suburban
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Suburban scraper and importer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install beautifulsoup4 requests "psycopg[binary]" python-dotenv
      - name: Compile modules
        run: python -m py_compile scripts/scrapers/suburban.py scripts/scrapers/usf/jobs/refresh_suburban_listing_prices.py scripts/importers/import_suburban.py
      - name: Run focused tests
        run: python -m unittest tests.test_suburban_scraper tests.test_suburban_importer

  run:
    name: Run Suburban listing-first pipeline
    needs: validate
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install beautifulsoup4 requests "psycopg[binary]" python-dotenv
      - name: Run bounded scraper and importer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            MAX_PAGES="0"
            DETAIL_LIMIT="500"
            WRITE="false"
          else
            MAX_PAGES="${{ inputs.max_pages }}"
            DETAIL_LIMIT="${{ inputs.detail_limit }}"
            WRITE="${{ inputs.write }}"
          fi

          python -m scripts.scrapers.suburban \
            --mode both \
            --max-pages "$MAX_PAGES" \
            --detail-limit "$DETAIL_LIMIT" \
            --output-dir /tmp/suburban-output

          if [ "$WRITE" = "true" ]; then
            python -m scripts.scrapers.usf.jobs.refresh_suburban_listing_prices \
              --max-pages "$MAX_PAGES"
          fi

          if [ "$WRITE" = "true" ]; then
            if [ -z "${DATABASE_URL:-}" ]; then
              echo "DATABASE_URL secret ontbreekt voor een write-run" >&2
              exit 1
            fi
            python -m scripts.importers.import_suburban \
              /tmp/suburban-output/suburban_master.csv \
              --rejects output/suburban_rejects.csv \
              --summary output/suburban_import_summary.json
          else
            python -m scripts.importers.import_suburban \
              /tmp/suburban-output/suburban_master.csv \
              --dry-run \
              --rejects output/suburban_rejects.csv \
              --summary output/suburban_import_summary.json
          fi
      - name: Upload scraper and importer output
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: suburban-pipeline-${{ github.run_id }}
          path: |
            /tmp/suburban-output/*.csv
            output/suburban_*.csv
            output/suburban_*.json
          if-no-files-found: warn
