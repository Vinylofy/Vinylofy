name: Cover Backfill

on:
  workflow_dispatch:
    inputs:
      refresh_limit:
        description: "Producten per candidate-refresh batch"
        required: true
        default: "100"

      publish_limit:
        description: "Maximale worker-claims per batch"
        required: true
        default: "100"

      max_batches:
        description: "Maximaal aantal batches in deze run"
        required: true
        default: "3"

      checkpoint:
        description: "Resume checkpoint; leeg = start cataloguspass"
        required: false
        default: ""

      include_covered:
        description: "Ook expliciete bestaande-cover repairs meenemen"
        required: true
        default: false
        type: boolean

      dry_run:
        description: "Geen database- of Storage-writes"
        required: true
        default: true
        type: boolean

concurrency:
  group: vinylofy-cover-pipeline
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      VINYLOFY_COVER_STORAGE_BUCKET: ${{ vars.VINYLOFY_COVER_STORAGE_BUCKET }}
      VINYLOFY_COVER_STORAGE_PREFIX: ${{ vars.VINYLOFY_COVER_STORAGE_PREFIX }}
      VINYLOFY_COVER_SHOP_PRIORITY_JSON: ${{ vars.VINYLOFY_COVER_SHOP_PRIORITY_JSON }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install --requirement requirements-cover.txt

      - name: Prepare folders
        shell: bash
        run: |
          mkdir -p output/cover_pipeline/backfill

      # Central cover entrypoints remain the source of truth.
      # The resumable orchestrator invokes:
      # scripts/maintenance/cover_candidate_refresh.py
      # scripts/maintenance/cover_worker.py
      - name: Run bounded resumable backfill
        shell: bash
        run: |
          INCLUDE_COVERED=""
          DRY_RUN=""

          if [ "${{ github.event.inputs.include_covered }}" = "true" ]; then
            INCLUDE_COVERED="--include-covered"
          fi

          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN="--dry-run"
          fi

          python -u scripts/maintenance/cover_backfill.py \
            --refresh-limit "${{ github.event.inputs.refresh_limit }}" \
            --publish-limit "${{ github.event.inputs.publish_limit }}" \
            --max-batches "${{ github.event.inputs.max_batches }}" \
            --checkpoint "${{ github.event.inputs.checkpoint }}" \
            $INCLUDE_COVERED \
            $DRY_RUN \
            --output-json \
              output/cover_pipeline/backfill_progress.json

      - name: Write run summary
        if: always()
        shell: bash
        run: |
          python scripts/maintenance/cover_workflow_summary.py \
            --title "Cover Backfill" \
            --status "${{ job.status }}" \
            --summary-json \
              "Backfill progress=output/cover_pipeline/backfill_progress.json" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: cover-backfill-${{ github.run_id }}
          path: output/cover_pipeline/**/*.json
          if-no-files-found: warn
