name: USF - CD Hal Ruinen

on:
  # Paused after the bounded Windows run on 2026-09-28: CD Hal returned 403
  # to both requests and Playwright. Restore the 37 1 * * * schedule only
  # after a bounded listing dry-run succeeds without bypassing the block.
  workflow_dispatch:
    inputs:
      listing_max_pages:
        description: "0 = volledige collectie; gebruik 2 voor eerste test"
        required: true
        default: "2"
        type: string

      run_detail:
        description: "Details, stage, promote en quarantine uitvoeren"
        required: true
        default: true
        type: boolean

      detail_limit:
        description: "Maximumaantal detailpagina's"
        required: true
        default: "25"
        type: string

      debug_listing:
        description: "Uitgebreide listingdiagnose tonen"
        required: true
        default: true
        type: boolean

      write:
        description: "Werkelijke databasewrites uitvoeren"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: usf-cdhal-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate CD Hal Ruinen USF
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

          if [ -f requirements-scrapers.txt ]; then
            pip install -r requirements-scrapers.txt
          fi

          pip install \
            requests \
            beautifulsoup4 \
            "psycopg[binary]" \
            python-dotenv

      - name: Compile CD Hal Ruinen modules
        shell: bash
        run: |
          set -euo pipefail

          python -m py_compile \
            scripts/scrapers/usf/jobs/refresh_cdhal_listing_prices.py \
            scripts/scrapers/usf/jobs/detail_cdhal.py \
            scripts/scrapers/usf/jobs/stage_cdhal.py \
            scripts/scrapers/usf/jobs/promote_cdhal.py \
            scripts/scrapers/usf/jobs/quarantine_cdhal.py \
            scripts/scrapers/usf/jobs/run_cdhal_pipeline.py

      - name: Run focused CD Hal tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_cdhal_listing

      - name: Verify CD Hal Ruinen HTML-only price authority
        shell: bash
        run: |
          set -euo pipefail
          TARGET="scripts/scrapers/usf/jobs/refresh_cdhal_listing_prices.py"

          if grep -Eq 'fetch_collection_json_prices|selected_json_price|json_product_price|json_variant_price|collection_products_json' "$TARGET"; then
            echo "[ERROR] JSON-prijsfallback is aanwezig."
            exit 1
          fi

          grep -q 'BeautifulSoup' "$TARGET"
          grep -q 'product-item' "$TARGET"

          echo "[OK] CD Hal Ruinen gebruikt listing-HTML zonder JSON-prijsfallback."
      - name: Validate CLIs
        shell: bash
        run: |
          set -euo pipefail

          python -m scripts.scrapers.usf.jobs.refresh_cdhal_listing_prices --help >/dev/null
          python -m scripts.scrapers.usf.jobs.detail_cdhal --help >/dev/null
          python -m scripts.scrapers.usf.jobs.stage_cdhal --help >/dev/null
          python -m scripts.scrapers.usf.jobs.promote_cdhal --help >/dev/null
          python -m scripts.scrapers.usf.jobs.quarantine_cdhal --help >/dev/null
          python -m scripts.scrapers.usf.jobs.run_cdhal_pipeline --help >/dev/null

  pipeline:
    name: Run CD Hal Ruinen USF
    needs: validate
    # CD Hal blokkeert verkeer vanaf GitHub-hosted runner-IP's.
    # Gebruik dezelfde NL/EU self-hosted runner als Variaworld.
    runs-on: [self-hosted, Windows, X64, vinylofy-windows]
    timeout-minutes: 360

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PIP_NO_CACHE_DIR: "1"

    steps:
      - name: Verify runner
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          RUNNER_NAME: ${{ runner.name }}
        run: |
          if ($env:RUNNER_NAME -ne 'vinylofy-windows-01') {
            throw "Unexpected runner: $env:RUNNER_NAME"
          }
          Write-Host "Runner: $env:RUNNER_NAME"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: cdhal
          persist-credentials: false

      - name: Setup uv and Python 3.11
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.15"
          python-version: "3.11"
          working-directory: ${{ github.workspace }}/cdhal
          enable-cache: false
        env:
          UV_CACHE_DIR: ${{ runner.temp }}/cdhal-uv-cache

      - name: Install dependencies
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        working-directory: cdhal
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:LOCALAPPDATA) { throw 'LOCALAPPDATA is required for managed Python.' }
          $env:UV_PYTHON_INSTALL_DIR = Join-Path $env:LOCALAPPDATA 'Vinylofy\cdhal-python'
          $venv = Join-Path $env:RUNNER_TEMP 'cdhal-venv'
          if (Test-Path -LiteralPath $venv) {
            Remove-Item -LiteralPath $venv -Recurse -Force
          }
          uv venv --no-project --seed --managed-python --python 3.11 $venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = Join-Path $venv 'Scripts/python.exe'
          & $python --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path -LiteralPath requirements.txt) {
            & $python -m pip install -r requirements.txt
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (Test-Path -LiteralPath requirements-scrapers.txt) {
            & $python -m pip install -r requirements-scrapers.txt
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          & $python -m pip install requests beautifulsoup4 'psycopg[binary]' python-dotenv playwright
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Playwright Chromium
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:LOCALAPPDATA) { throw 'LOCALAPPDATA is required for Chromium.' }
          # The E: runner temp drive does not support Playwright's browser install lock.
          $env:PLAYWRIGHT_BROWSERS_PATH = Join-Path $env:LOCALAPPDATA 'Vinylofy\cdhal-playwright'
          $python = Join-Path $env:RUNNER_TEMP 'cdhal-venv/Scripts/python.exe'
          & $python -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate database secret
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          if (-not $env:DATABASE_URL) {
            throw 'DATABASE_URL secret ontbreekt.'
          }

      - name: Run CD Hal Ruinen pipeline
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        working-directory: cdhal
        env:
          LISTING_MAX_PAGES_INPUT: ${{ inputs.listing_max_pages }}
          RUN_DETAIL_INPUT: ${{ inputs.run_detail }}
          DETAIL_LIMIT_INPUT: ${{ inputs.detail_limit }}
          DEBUG_LISTING_INPUT: ${{ inputs.debug_listing }}
          WRITE_INPUT: ${{ inputs.write }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:LOCALAPPDATA) { throw 'LOCALAPPDATA is required for Chromium.' }
          $env:PLAYWRIGHT_BROWSERS_PATH = Join-Path $env:LOCALAPPDATA 'Vinylofy\cdhal-playwright'
          $logDir = Join-Path $PWD 'output/usf-cdhal'
          New-Item -ItemType Directory -Path $logDir -Force | Out-Null

          if ($env:GITHUB_EVENT_NAME -eq 'schedule') {
            $listingMaxPages = '0'
            $runDetail = 'true'
            $detailLimit = '500'
            $debugListing = 'false'
            $write = 'true'
          } else {
            $listingMaxPages = $env:LISTING_MAX_PAGES_INPUT
            $runDetail = $env:RUN_DETAIL_INPUT
            $detailLimit = $env:DETAIL_LIMIT_INPUT
            $debugListing = $env:DEBUG_LISTING_INPUT
            $write = $env:WRITE_INPUT
          }
          $python = Join-Path $env:RUNNER_TEMP 'cdhal-venv/Scripts/python.exe'
          $pipelineArgs = @(
            '-u', '-m', 'scripts.scrapers.usf.jobs.run_cdhal_pipeline',
            '--listing-start-page', '1',
            '--listing-max-pages', $listingMaxPages,
            '--listing-sleep', '0.35',
            '--max-page-failures', '3',
            '--detail-limit', $detailLimit,
            '--detail-sleep', '0.50',
            '--detail-retry-days', '30',
            '--stage-limit', $detailLimit,
            '--promote-limit', $detailLimit,
            '--quarantine-limit', '100'
          )
          if ($runDetail -eq 'true') {
            $pipelineArgs += '--run-detail'
          }
          if ($debugListing -eq 'true') {
            $pipelineArgs += '--debug-listing'
          }
          if ($write -eq 'true') {
            $pipelineArgs += '--write'
          }
          Write-Host "$python $($pipelineArgs -join ' ')"
          $log = Join-Path $logDir 'pipeline.log'
          $ErrorActionPreference = 'Continue'
          & $python @pipelineArgs 2>&1 | Tee-Object -FilePath $log
          $pipelineExitCode = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          if ($pipelineExitCode -ne 0) { exit $pipelineExitCode }

      - name: Upload pipeline log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usf-cdhal-${{ github.run_id }}
          path: cdhal/output/usf-cdhal/**
          if-no-files-found: warn
          retention-days: 14

      - name: Clean temporary CD Hal files
        if: always()
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in @('cdhal-venv', 'cdhal-uv-cache')) {
            $path = Join-Path $env:RUNNER_TEMP $name
            if (Test-Path -LiteralPath $path) {
              Remove-Item -LiteralPath $path -Recurse -Force
            }
          }
