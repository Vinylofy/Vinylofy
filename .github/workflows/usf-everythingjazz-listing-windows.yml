name: USF - Everything Jazz Listing (Windows local)

on:
  schedule:
    - cron: "12 7,15,19 * * *"
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Maximum aantal collectiepagina's"
        required: true
        default: "40"
        type: string
      page_size:
        description: "Shopify-producten per pagina; maximaal 100"
        required: true
        default: "50"
        type: string
      write:
        description: "Database daadwerkelijk bijwerken"
        required: true
        default: false
        type: boolean
      debug:
        description: "Uitgebreide listingdiagnostiek"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: vinylofy-everythingjazz
  cancel-in-progress: false

jobs:
  listing:
    name: Refresh Everything Jazz listing on Windows
    runs-on: [self-hosted, Windows, X64, vinylofy-windows]
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PIP_NO_CACHE_DIR: "1"
    steps:
      - name: Verify runner
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          RUNNER_NAME: ${{ runner.name }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'vinylofy-windows-01') { throw "Unexpected runner: $env:RUNNER_NAME" }
          Write-Host "Runner: $env:RUNNER_NAME"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: everythingjazz
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.15"
          working-directory: ${{ github.workspace }}/everythingjazz
          enable-cache: false
        env:
          UV_CACHE_DIR: ${{ runner.temp }}/everythingjazz-uv-cache

      - name: Check and install persistent dependencies
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        working-directory: everythingjazz
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:LOCALAPPDATA) { throw 'LOCALAPPDATA is required.' }
          $root = Join-Path $env:LOCALAPPDATA 'Vinylofy'
          $env:UV_PYTHON_INSTALL_DIR = Join-Path $root 'everythingjazz-python'
          $venv = Join-Path $root 'everythingjazz-venv'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          if (-not (Test-Path -LiteralPath (Join-Path $venv 'Scripts/python.exe'))) {
            Write-Host "Creating persistent Everything Jazz environment: $venv"
            uv venv --no-project --seed --managed-python --python 3.11 $venv
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else { Write-Host "Reusing persistent Everything Jazz environment: $venv" }
          $python = Join-Path $venv 'Scripts/python.exe'
          & $python --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $packages = @(
            @{ Name = 'requests'; Import = 'requests' },
            @{ Name = 'beautifulsoup4'; Import = 'bs4' },
            @{ Name = 'psycopg[binary]'; Import = 'psycopg' },
            @{ Name = 'python-dotenv'; Import = 'dotenv' }
          )
          $missing = @()
          foreach ($package in $packages) {
            $previousErrorActionPreference = $ErrorActionPreference
            $ErrorActionPreference = 'Continue'
            & $python -c "import $($package.Import)" 2>$null
            $importExitCode = $LASTEXITCODE
            $ErrorActionPreference = $previousErrorActionPreference
            if ($importExitCode -ne 0) { $missing += $package.Name }
          }
          if ($missing.Count -gt 0) {
            Write-Host "Installing missing packages: $($missing -join ', ')"
            & $python -m pip install @missing
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else { Write-Host 'All Everything Jazz runtime packages are already available.' }
          $modules = @('scripts/scrapers/usf/jobs/everythingjazz_product_type.py', 'scripts/scrapers/usf/jobs/refresh_everythingjazz_listing_prices.py')
          & $python -m py_compile @modules
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m scripts.scrapers.usf.jobs.refresh_everythingjazz_listing_prices --help *> $null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate configuration and modules
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          EVENT_NAME: ${{ github.event_name }}
          MAX_PAGES_INPUT: ${{ inputs.max_pages }}
          PAGE_SIZE_INPUT: ${{ inputs.page_size }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:DATABASE_URL) { throw 'GitHub secret DATABASE_URL ontbreekt.' }
          if ($env:EVENT_NAME -eq 'schedule') { $maxPages = 40; $pageSize = 50 } else { $maxPages = [int]$env:MAX_PAGES_INPUT; $pageSize = [int]$env:PAGE_SIZE_INPUT }
          if ($maxPages -lt 1 -or $maxPages -gt 100) { throw 'max_pages moet tussen 1 en 100 liggen.' }
          if ($pageSize -lt 1 -or $pageSize -gt 100) { throw 'page_size moet tussen 1 en 100 liggen.' }
          Write-Host "[CONFIG] max_pages=$maxPages page_size=$pageSize DATABASE_URL is ingesteld."

      - name: Run Everything Jazz listing refresh
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        working-directory: everythingjazz
        env:
          EVENT_NAME: ${{ github.event_name }}
          MAX_PAGES_INPUT: ${{ inputs.max_pages }}
          PAGE_SIZE_INPUT: ${{ inputs.page_size }}
          WRITE_INPUT: ${{ inputs.write }}
          DEBUG_INPUT: ${{ inputs.debug }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:EVENT_NAME -eq 'schedule') {
            $maxPages = '40'; $pageSize = '50'; $write = 'true'; $debug = 'false'
          } else {
            $maxPages = $env:MAX_PAGES_INPUT; $pageSize = $env:PAGE_SIZE_INPUT; $write = $env:WRITE_INPUT; $debug = $env:DEBUG_INPUT
          }
          $python = Join-Path $env:LOCALAPPDATA 'Vinylofy/everythingjazz-venv/Scripts/python.exe'
          $args = @('-u', '-m', 'scripts.scrapers.usf.jobs.refresh_everythingjazz_listing_prices', '--start-page', '1', '--max-pages', $maxPages, '--page-size', $pageSize, '--sleep', '0.25')
          if ($write -eq 'true') { $args += '--write' }
          if ($debug -eq 'true') { $args += '--debug' }
          $outputDir = Join-Path $env:RUNNER_TEMP 'everythingjazz-listing'
          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null
          $log = Join-Path $outputDir 'listing.log'
          Write-Host "settings: max_pages=$maxPages page_size=$pageSize write=$write debug=$debug"
          Write-Host "$python $($args -join ' ')"
          & $python @args 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload listing log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: everythingjazz-listing-${{ github.run_id }}
          path: ${{ runner.temp }}/everythingjazz-listing/
          if-no-files-found: warn
          retention-days: 7

      - name: Clean run-specific uv cache
        if: always()
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $cache = Join-Path $env:RUNNER_TEMP 'everythingjazz-uv-cache'
          if (Test-Path -LiteralPath $cache) { Remove-Item -LiteralPath $cache -Recurse -Force }
