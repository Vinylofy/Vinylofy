name: USF - Music On Vinyl

on:
  schedule:
    # Dagelijkse volle listing/prijsrefresh
    - cron: "17 2 * * *"
    # Elke 2 uur detail enrichment, kleine batch
    - cron: "23 */2 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: "price-only"
        type: choice
        options:
          - price-only
          - detail
          - full
      collections:
        description: "Comma-separated collections"
        required: true
        default: "all-products,new-releases,back-in-stock"
        type: string
      max_pages:
        description: "Aantal pagina's per collection"
        required: true
        default: "1"
        type: string
      listing_limit:
        description: "Shopify products.json limit per page"
        required: true
        default: "250"
        type: string
      materialize_limit:
        description: "Max queued links naar raw"
        required: true
        default: "500"
        type: string
      stage_limit:
        description: "Max raw snapshots naar staged_offers"
        required: true
        default: "500"
        type: string
      promote_limit:
        description: "Max staged offers promoveren"
        required: true
        default: "500"
        type: string
      write:
        description: "Werkelijke databasewrites uitvoeren"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: usf-musiconvinyl-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Music On Vinyl USF modules
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-scrapers.txt ]; then pip install -r requirements-scrapers.txt; fi
          pip install requests beautifulsoup4 "psycopg[binary]" python-dotenv

      - name: Compile modules
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/scrapers/musiconvinyl.py \
            scripts/scrapers/usf/jobs/discover_musiconvinyl.py \
            scripts/scrapers/usf/jobs/materialize_musiconvinyl_listing.py \
            scripts/scrapers/usf/jobs/refresh_musiconvinyl_listing_prices.py \
            scripts/scrapers/usf/jobs/stage_musiconvinyl.py \
            scripts/scrapers/usf/jobs/promote_musiconvinyl.py \
            scripts/scrapers/usf/jobs/run_musiconvinyl_pipeline.py \
            scripts/scrapers/usf/jobs/enrich_musiconvinyl_details.py \
            scripts/scrapers/usf/jobs/refresh_musiconvinyl_prices_only.py \
            scripts/scrapers/usf/jobs/sync_musiconvinyl_listing_prices.py

      - name: Validate CLIs
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.scrapers.usf.jobs.discover_musiconvinyl --help
          python -m scripts.scrapers.usf.jobs.materialize_musiconvinyl_listing --help
          python -m scripts.scrapers.usf.jobs.refresh_musiconvinyl_listing_prices --help
          python -m scripts.scrapers.usf.jobs.stage_musiconvinyl --help
          python -m scripts.scrapers.usf.jobs.promote_musiconvinyl --help
          python -m scripts.scrapers.usf.jobs.run_musiconvinyl_pipeline --help

  run:
    name: Run Music On Vinyl USF pipeline
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-scrapers.txt ]; then pip install -r requirements-scrapers.txt; fi
          pip install requests beautifulsoup4 "psycopg[binary]" python-dotenv

      - name: Run selected mode
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.write }}" = "true" ] && [ -z "${DATABASE_URL:-}" ]; then
            echo "[ERROR] DATABASE_URL ontbreekt"
            exit 1
          fi

          if [ "${{ inputs.mode }}" = "price-only" ]; then
            PRICE_REFRESH=(
              python -u -m scripts.scrapers.usf.jobs.refresh_musiconvinyl_prices_only
              --collections "${{ inputs.collections }}"
              --max-pages "${{ inputs.max_pages }}"
              --listing-limit "${{ inputs.listing_limit }}"
            )
            FAST_SYNC=(
              python -u -m scripts.scrapers.usf.jobs.sync_musiconvinyl_listing_prices
            )
            if [ "${{ inputs.write }}" = "true" ]; then
              PRICE_REFRESH+=(--write)
              FAST_SYNC+=(--write)
            fi
            printf '[WORKFLOW] Price refresh:'
            printf ' %q' "${PRICE_REFRESH[@]}"
            printf '\n'
            "${PRICE_REFRESH[@]}"

            printf '[WORKFLOW] Fast sync:'
            printf ' %q' "${FAST_SYNC[@]}"
            printf '\n'
            "${FAST_SYNC[@]}"
            exit 0
          fi

          if [ "${{ inputs.mode }}" = "detail" ]; then
            DETAIL=(
              python -u -m scripts.scrapers.usf.jobs.enrich_musiconvinyl_details
              --limit "${{ inputs.materialize_limit }}"
              --sleep 3
            )
            STAGE=(
              python -u -m scripts.scrapers.usf.jobs.stage_musiconvinyl
              --limit "${{ inputs.stage_limit }}"
            )
            PROMOTE=(
              python -u -m scripts.scrapers.usf.jobs.promote_musiconvinyl
              --limit "${{ inputs.promote_limit }}"
            )
            if [ "${{ inputs.write }}" = "true" ]; then
              DETAIL+=(--write)
              STAGE+=(--write)
              PROMOTE+=(--write)
            fi

            printf '[WORKFLOW] Detail enrichment:'
            printf ' %q' "${DETAIL[@]}"
            printf '\n'
            "${DETAIL[@]}"

            printf '[WORKFLOW] Stage:'
            printf ' %q' "${STAGE[@]}"
            printf '\n'
            "${STAGE[@]}"

            printf '[WORKFLOW] Promote:'
            printf ' %q' "${PROMOTE[@]}"
            printf '\n'
            "${PROMOTE[@]}"
            exit 0
          fi

          if [ "${{ inputs.mode }}" = "full" ]; then
            COMMAND=(
              python -u -m scripts.scrapers.usf.jobs.run_musiconvinyl_pipeline
              --collections "${{ inputs.collections }}"
              --max-pages "${{ inputs.max_pages }}"
              --listing-limit "${{ inputs.listing_limit }}"
              --materialize-limit "${{ inputs.materialize_limit }}"
              --stage-limit "${{ inputs.stage_limit }}"
              --promote-limit "${{ inputs.promote_limit }}"
            )
            if [ "${{ inputs.write }}" = "true" ]; then
              COMMAND+=(--write)
            fi
            printf '[WORKFLOW] Full pipeline:'
            printf ' %q' "${COMMAND[@]}"
            printf '\n'
            "${COMMAND[@]}"
            exit 0
          fi

          echo "[ERROR] Unknown mode: ${{ inputs.mode }}"
          exit 1

  scheduled-price-refresh:
    name: Scheduled full listing price refresh
    if: github.event_name == 'schedule' && github.event.schedule == '17 2 * * *'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-scrapers.txt ]; then pip install -r requirements-scrapers.txt; fi
          pip install requests beautifulsoup4 "psycopg[binary]" python-dotenv

      - name: Full price refresh without details
        shell: bash
        run: |
          set -euo pipefail
          python -u -m scripts.scrapers.usf.jobs.refresh_musiconvinyl_prices_only \
            --collections all-products,new-releases,back-in-stock \
            --max-pages 10 \
            --listing-limit 250 \
            --write

      - name: Sync live prices from listing payload
        shell: bash
        run: |
          set -euo pipefail
          python -u -m scripts.scrapers.usf.jobs.sync_musiconvinyl_listing_prices --write

  scheduled-detail-enrichment:
    name: Scheduled detail enrichment batch
    if: github.event_name == 'schedule' && github.event.schedule == '23 */2 * * *'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-scrapers.txt ]; then pip install -r requirements-scrapers.txt; fi
          pip install requests beautifulsoup4 "psycopg[binary]" python-dotenv

      - name: Enrich 25 details
        shell: bash
        run: |
          set -euo pipefail
          python -u -m scripts.scrapers.usf.jobs.enrich_musiconvinyl_details \
            --limit 25 \
            --sleep 3 \
            --write

      - name: Stage enriched rows
        shell: bash
        run: |
          set -euo pipefail
          python -u -m scripts.scrapers.usf.jobs.stage_musiconvinyl --limit 25 --write

      - name: Promote enriched rows
        shell: bash
        run: |
          set -euo pipefail
          python -u -m scripts.scrapers.usf.jobs.promote_musiconvinyl --limit 25 --write

