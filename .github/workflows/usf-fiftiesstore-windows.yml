name: USF - FiftiesStore (Windows local)

on:
  schedule:
    - cron: "35 3 * * *"
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Clerk API batch size"
        required: true
        default: "500"
        type: string
      max_products:
        description: "Maximaal aantal producten; 0 = alle"
        required: true
        default: "50"
        type: string
      sync_limit:
        description: "Maximaal aantal recente listinglinks voor prijs-sync"
        required: true
        default: "50"
        type: string
      stage_limit:
        description: "Max staged offers"
        required: true
        default: "0"
        type: string
      promote_limit:
        description: "Max promoted offers"
        required: true
        default: "0"
        type: string
      write:
        description: "Write to database"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: usf-fiftiesstore-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate FiftiesStore USF on Windows
    runs-on: [self-hosted, Windows, X64, vinylofy-windows]
    timeout-minutes: 30
    steps:
      - name: Verify runner
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          RUNNER_NAME: ${{ runner.name }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'vinylofy-windows-01') { throw "Unexpected runner: $env:RUNNER_NAME" }
          Write-Host "Runner: $env:RUNNER_NAME"
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: fiftiesstore
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.15"
          python-version: "3.12"
          working-directory: ${{ github.workspace }}/fiftiesstore
          enable-cache: false
        env:
          UV_CACHE_DIR: ${{ runner.temp }}/fiftiesstore-uv-cache
      - name: Prepare persistent environment and validate
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        working-directory: fiftiesstore
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:LOCALAPPDATA) { throw 'LOCALAPPDATA is required for the persistent environment.' }
          $env:UV_PYTHON_INSTALL_DIR = Join-Path $env:LOCALAPPDATA 'Vinylofy\fiftiesstore-python'
          $venv = Join-Path $env:LOCALAPPDATA 'Vinylofy\fiftiesstore-venv'
          $python = Join-Path $venv 'Scripts/python.exe'
          if (-not (Test-Path -LiteralPath $python)) {
            Write-Host "Creating persistent FiftiesStore environment: $venv"
            uv venv --no-project --seed --managed-python --python 3.12 --link-mode copy $venv
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else { Write-Host "Reusing persistent FiftiesStore environment: $venv" }
          $packages = @(
            @{ Import = 'psycopg'; Spec = 'psycopg[binary]' },
            @{ Import = 'dotenv'; Spec = 'python-dotenv' }
          )
          foreach ($package in $packages) {
            & $python -c "import importlib.util,sys; sys.exit(0 if importlib.util.find_spec('$($package.Import)') else 1)"
            if ($LASTEXITCODE -ne 0) {
              Write-Host "Installing missing package: $($package.Spec)"
              & $python -m pip install $package.Spec
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            } else { Write-Host "Package already available: $($package.Spec)" }
          }
          $modules = @(
            'scripts/scrapers/usf/core/delist_missing_links.py',
            'scripts/scrapers/usf/jobs/refresh_fiftiesstore_listing_prices.py',
            'scripts/scrapers/usf/jobs/sync_fiftiesstore_listing_prices.py',
            'scripts/scrapers/usf/jobs/stage_fiftiesstore.py',
            'scripts/scrapers/usf/jobs/promote_fiftiesstore.py'
          )
          & $python -m py_compile @modules
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($module in @('refresh_fiftiesstore_listing_prices', 'sync_fiftiesstore_listing_prices', 'stage_fiftiesstore', 'promote_fiftiesstore')) {
            & $python -m "scripts.scrapers.usf.jobs.$module" --help *> $null
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  run:
    name: Run FiftiesStore USF pipeline on Windows
    needs: validate
    runs-on: [self-hosted, Windows, X64, vinylofy-windows]
    timeout-minutes: 180
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONUNBUFFERED: "1"
      PIP_NO_CACHE_DIR: "1"
    steps:
      - name: Verify runner
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          RUNNER_NAME: ${{ runner.name }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'vinylofy-windows-01') { throw "Unexpected runner: $env:RUNNER_NAME" }
          Write-Host "Runner: $env:RUNNER_NAME"
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: fiftiesstore
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.15"
          python-version: "3.12"
          working-directory: ${{ github.workspace }}/fiftiesstore
          enable-cache: false
        env:
          UV_CACHE_DIR: ${{ runner.temp }}/fiftiesstore-uv-cache
      - name: Prepare persistent environment and missing dependencies
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        working-directory: fiftiesstore
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:LOCALAPPDATA) { throw 'LOCALAPPDATA is required for the persistent environment.' }
          $env:UV_PYTHON_INSTALL_DIR = Join-Path $env:LOCALAPPDATA 'Vinylofy\fiftiesstore-python'
          $venv = Join-Path $env:LOCALAPPDATA 'Vinylofy\fiftiesstore-venv'
          $python = Join-Path $venv 'Scripts/python.exe'
          if (-not (Test-Path -LiteralPath $python)) {
            Write-Host "Creating persistent FiftiesStore environment: $venv"
            uv venv --no-project --seed --managed-python --python 3.12 --link-mode copy $venv
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else { Write-Host "Reusing persistent FiftiesStore environment: $venv" }
          $packages = @(
            @{ Import = 'psycopg'; Spec = 'psycopg[binary]' },
            @{ Import = 'dotenv'; Spec = 'python-dotenv' }
          )
          foreach ($package in $packages) {
            & $python -c "import importlib.util,sys; sys.exit(0 if importlib.util.find_spec('$($package.Import)') else 1)"
            if ($LASTEXITCODE -ne 0) {
              Write-Host "Installing missing package: $($package.Spec)"
              & $python -m pip install $package.Spec
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            } else { Write-Host "Package already available: $($package.Spec)" }
          }
      - name: Validate configuration
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:DATABASE_URL) { throw 'GitHub secret DATABASE_URL ontbreekt' }
          Write-Host '[CONFIG] DATABASE_URL is ingesteld'
      - name: Run FiftiesStore pipeline
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        working-directory: fiftiesstore
        env:
          EVENT_NAME: ${{ github.event_name }}
          BATCH_SIZE_INPUT: ${{ inputs.batch_size }}
          MAX_PRODUCTS_INPUT: ${{ inputs.max_products }}
          SYNC_LIMIT_INPUT: ${{ inputs.sync_limit }}
          STAGE_LIMIT_INPUT: ${{ inputs.stage_limit }}
          PROMOTE_LIMIT_INPUT: ${{ inputs.promote_limit }}
          WRITE_INPUT: ${{ inputs.write }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path 'output/usf-fiftiesstore' | Out-Null
          $python = Join-Path $env:LOCALAPPDATA 'Vinylofy/fiftiesstore-venv/Scripts/python.exe'
          if ($env:EVENT_NAME -eq 'schedule') {
            $batchSize = '500'; $maxProducts = '0'; $syncLimit = '10000'; $stageLimit = '6000'; $promoteLimit = '6000'; $write = 'true'
          } else {
            $batchSize = if ($env:BATCH_SIZE_INPUT) { $env:BATCH_SIZE_INPUT } else { '500' }
            $maxProducts = if ($env:MAX_PRODUCTS_INPUT) { $env:MAX_PRODUCTS_INPUT } else { '50' }
            $syncLimit = if ($env:SYNC_LIMIT_INPUT) { $env:SYNC_LIMIT_INPUT } else { '50' }
            $stageLimit = if ($env:STAGE_LIMIT_INPUT) { $env:STAGE_LIMIT_INPUT } else { '0' }
            $promoteLimit = if ($env:PROMOTE_LIMIT_INPUT) { $env:PROMOTE_LIMIT_INPUT } else { '0' }
            $write = if ($env:WRITE_INPUT) { $env:WRITE_INPUT } else { 'false' }
          }
          $refresh = @('-u', '-m', 'scripts.scrapers.usf.jobs.refresh_fiftiesstore_listing_prices', '--batch-size', $batchSize, '--max-products', $maxProducts, '--sleep', '0.25', '--skip-raw')
          if ($write -eq 'true') { $refresh += '--write' }
          Write-Host "[WORKFLOW] refresh $python $($refresh -join ' ')"
          & $python @refresh 2>&1 | Tee-Object -FilePath 'output/usf-fiftiesstore/refresh.log'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sync = @('-u', '-m', 'scripts.scrapers.usf.jobs.sync_fiftiesstore_listing_prices', '--limit', $syncLimit)
          if ($write -eq 'true') { $sync += '--write' }
          Write-Host "[WORKFLOW] sync $python $($sync -join ' ')"
          & $python @sync 2>&1 | Tee-Object -FilePath 'output/usf-fiftiesstore/sync.log'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ([int]$stageLimit -gt 0) {
            $stage = @('-u', '-m', 'scripts.scrapers.usf.jobs.stage_fiftiesstore', '--limit', $stageLimit)
            if ($write -eq 'true') { $stage += '--write' }
            Write-Host "[WORKFLOW] stage $python $($stage -join ' ')"
            & $python @stage 2>&1 | Tee-Object -FilePath 'output/usf-fiftiesstore/stage.log'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else { Write-Host '[WORKFLOW] stage skipped because stage_limit=0' }
          if ([int]$promoteLimit -gt 0) {
            $promote = @('-u', '-m', 'scripts.scrapers.usf.jobs.promote_fiftiesstore', '--limit', $promoteLimit)
            if ($write -eq 'true') { $promote += '--write' }
            Write-Host "[WORKFLOW] promote $python $($promote -join ' ')"
            & $python @promote 2>&1 | Tee-Object -FilePath 'output/usf-fiftiesstore/promote.log'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else { Write-Host '[WORKFLOW] promote skipped because promote_limit=0' }
      - name: Upload pipeline logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usf-fiftiesstore-windows-${{ github.run_id }}
          path: fiftiesstore/output/usf-fiftiesstore/
          if-no-files-found: ignore
      - name: Clean temporary FiftiesStore cache
        if: always()
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Join-Path $env:RUNNER_TEMP 'fiftiesstore-uv-cache'
          if (Test-Path -LiteralPath $path) { Remove-Item -LiteralPath $path -Recurse -Force }
