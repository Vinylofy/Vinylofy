name: USF - Sounds Venlo

on:
  workflow_dispatch:
    inputs:
      skip_listing:
        description: "Skip live listing fetch; use existing shop_product_links payload prices"
        required: true
        default: false
        type: boolean
      listing_max_pages:
        description: "Listing pages; 0 = all pages"
        required: true
        default: "1"
        type: string
      run_detail:
        description: "Also run detail, stage, promote and quarantine"
        required: true
        default: false
        type: boolean
      detail_limit:
        description: "Detail/stage/promote limit"
        required: true
        default: "1"
        type: string
      fast_price_sync:
        description: "Run fast listing price sync"
        required: true
        default: true
        type: boolean
      write:
        description: "Write to database"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: usf-soundsvenlo-production
  cancel-in-progress: false

jobs:
  run:
    name: Run Sounds Venlo USF
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-scrapers.txt ]; then pip install -r requirements-scrapers.txt; fi
          python -m pip install requests beautifulsoup4 "psycopg[binary]" python-dotenv playwright

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          python -m playwright install --with-deps chromium

      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "[ERROR] DATABASE_URL secret ontbreekt"
            exit 1
          fi
          echo "[CONFIG] DATABASE_URL is ingesteld"

      - name: Compile Sounds Venlo modules
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/scrapers/usf/jobs/refresh_soundsvenlo_listing_prices.py \
            scripts/scrapers/usf/jobs/detail_soundsvenlo.py \
            scripts/scrapers/usf/jobs/stage_soundsvenlo.py \
            scripts/scrapers/usf/jobs/promote_soundsvenlo.py \
            scripts/scrapers/usf/jobs/quarantine_soundsvenlo.py \
            scripts/scrapers/usf/jobs/run_soundsvenlo_pipeline.py \
            scripts/scrapers/usf/jobs/bootstrap_soundsvenlo_from_csv.py

      - name: Run Sounds Venlo pipeline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/usf-soundsvenlo

          COMMAND=(
            python -u -m scripts.scrapers.usf.jobs.run_soundsvenlo_pipeline
            --listing-start-page 1
            --listing-max-pages "${{ inputs.listing_max_pages }}"
            --listing-sleep 0.35
            --max-page-failures 3
            --detail-limit "${{ inputs.detail_limit }}"
            --detail-sleep 0.50
            --detail-retry-days 30
            --stage-limit "${{ inputs.detail_limit }}"
            --promote-limit "${{ inputs.detail_limit }}"
            --quarantine-limit 100
          )

          if [ "${{ inputs.skip_listing }}" = "true" ]; then
            COMMAND+=(--skip-listing)
          fi
          if [ "${{ inputs.fast_price_sync }}" = "true" ]; then
            COMMAND+=(--fast-price-sync)
          fi
          if [ "${{ inputs.run_detail }}" = "true" ]; then
            COMMAND+=(--run-detail)
          fi
          if [ "${{ inputs.write }}" = "true" ]; then
            COMMAND+=(--write)
          fi

          printf '[WORKFLOW] Command:'
          printf ' %q' "${COMMAND[@]}"
          printf '\n'

          "${COMMAND[@]}" 2>&1 | tee output/usf-soundsvenlo/pipeline.log

      - name: Upload pipeline log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usf-soundsvenlo-${{ github.run_id }}
          path: output/usf-soundsvenlo/**
          if-no-files-found: warn
          retention-days: 14
