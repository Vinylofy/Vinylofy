name: USF - Sounds Venlo

on:
  workflow_dispatch:
    inputs:
      skip_listing:
        description: "Skip live listing fetch; use existing shop_product_links payload prices"
        required: true
        default: true
        type: boolean
      listing_max_pages:
        description: "Listing pages; 0 = all pages"
        required: true
        default: "0"
        type: string
      run_detail:
        description: "Run detail enrichment + stage + promote + quarantine"
        required: true
        default: false
        type: boolean
      detail_limit:
        description: "Max detail pages for missing EAN/enrichment"
        required: true
        default: "500"
        type: string
      fast_price_sync:
        description: "Use fast listing price sync"
        required: true
        default: true
        type: boolean
      write:
        description: "Write to database"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: usf-soundsvenlo-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Sounds Venlo USF modules
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-scrapers.txt ]; then pip install -r requirements-scrapers.txt; fi
          pip install requests beautifulsoup4 "psycopg[binary]" python-dotenv

      - name: Compile Sounds Venlo USF modules
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/scrapers/usf/jobs/refresh_soundsvenlo_listing_prices.py \
            scripts/scrapers/usf/jobs/detail_soundsvenlo.py \
            scripts/scrapers/usf/jobs/stage_soundsvenlo.py \
            scripts/scrapers/usf/jobs/promote_soundsvenlo.py \
            scripts/scrapers/usf/jobs/quarantine_soundsvenlo.py \
            scripts/scrapers/usf/jobs/run_soundsvenlo_pipeline.py \
            scripts/scrapers/usf/jobs/bootstrap_soundsvenlo_from_csv.py

      - name: Validate command-line interfaces
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.scrapers.usf.jobs.refresh_soundsvenlo_listing_prices --help >/dev/null
          python -m scripts.scrapers.usf.jobs.detail_soundsvenlo --help >/dev/null
          python -m scripts.scrapers.usf.jobs.stage_soundsvenlo --help >/dev/null
          python -m scripts.scrapers.usf.jobs.promote_soundsvenlo --help >/dev/null
          python -m scripts.scrapers.usf.jobs.quarantine_soundsvenlo --help >/dev/null
          python -m scripts.scrapers.usf.jobs.run_soundsvenlo_pipeline --help >/dev/null
          python -m scripts.scrapers.usf.jobs.bootstrap_soundsvenlo_from_csv --help >/dev/null

  run:
    name: Run Sounds Venlo USF pipeline
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-scrapers.txt ]; then pip install -r requirements-scrapers.txt; fi
          pip install requests beautifulsoup4 "psycopg[binary]" python-dotenv

      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "[ERROR] DATABASE_URL secret ontbreekt"
            exit 1
          fi
          echo "[CONFIG] DATABASE_URL is ingesteld"

      - name: Run Sounds Venlo USF pipeline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/usf-soundsvenlo

          if [ "${{ github.event_name }}" = "schedule" ]; then
            SKIP_LISTING="true"
            LISTING_MAX_PAGES="0"
            DETAIL_LIMIT="500"
            FAST_PRICE_SYNC="true"
            WRITE="true"

            # Large-catalog policy: detail enrichment twice per week.
            # 1 = Monday, 4 = Thursday.
            DAY_OF_WEEK="$(date -u +%u)"
            if [ "$DAY_OF_WEEK" = "1" ] || [ "$DAY_OF_WEEK" = "4" ]; then
              RUN_DETAIL="true"
            else
              RUN_DETAIL="false"
            fi
          else
            SKIP_LISTING="${{ inputs.skip_listing }}"
            LISTING_MAX_PAGES="${{ inputs.listing_max_pages }}"
            RUN_DETAIL="${{ inputs.run_detail }}"
            DETAIL_LIMIT="${{ inputs.detail_limit }}"
            FAST_PRICE_SYNC="${{ inputs.fast_price_sync }}"
            WRITE="${{ inputs.write }}"
          fi

          COMMAND=(
            python -u -m scripts.scrapers.usf.jobs.run_soundsvenlo_pipeline
            --listing-start-page 1
            --listing-max-pages "$LISTING_MAX_PAGES"
            --listing-sleep 0.35
            --max-page-failures 3
            --detail-limit "$DETAIL_LIMIT"
            --detail-sleep 0.50
            --detail-retry-days 30
            --stage-limit "$DETAIL_LIMIT"
            --promote-limit "$DETAIL_LIMIT"
            --quarantine-limit 100
          )

          if [ "$SKIP_LISTING" = "true" ]; then
            COMMAND+=(--skip-listing)
          fi
          if [ "$FAST_PRICE_SYNC" = "true" ]; then
            COMMAND+=(--fast-price-sync)
          fi
          if [ "$RUN_DETAIL" = "true" ]; then
            COMMAND+=(--run-detail)
          fi
          if [ "$WRITE" = "true" ]; then
            COMMAND+=(--write)
          fi

          printf '[WORKFLOW] Command:'
          printf ' %q' "${COMMAND[@]}"
          printf '\n'

          "${COMMAND[@]}" 2>&1 | tee output/usf-soundsvenlo/pipeline.log

      - name: Upload pipeline log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usf-soundsvenlo-${{ github.run_id }}
          path: output/usf-soundsvenlo/**
          if-no-files-found: warn
          retention-days: 14
