name: USF - Sounds Venlo

on:
  schedule:
    - cron: "35 2 * * *"
  workflow_dispatch:
    inputs:
      skip_listing:
        description: "Skip live listing fetch; use existing shop_product_links payload prices"
        required: true
        default: false
        type: boolean
      listing_max_pages:
        description: "Listing pages; 0 = all pages"
        required: true
        default: "1"
        type: string
      run_detail:
        description: "Also run detail enrichment"
        required: true
        default: false
        type: boolean
      run_stage_promote:
        description: "Run stage and promote"
        required: true
        default: true
        type: boolean
      detail_limit:
        description: "Detail limit"
        required: true
        default: "500"
        type: string
      stage_limit:
        description: "Stage limit"
        required: true
        default: "10000"
        type: string
      promote_limit:
        description: "Promote limit"
        required: true
        default: "10000"
        type: string
      fast_price_sync:
        description: "Run fast listing price sync"
        required: true
        default: true
        type: boolean
      write:
        description: "Write to database"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: usf-soundsvenlo-production
  cancel-in-progress: false

jobs:
  run:
    name: Run Sounds Venlo USF
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-scrapers.txt ]; then pip install -r requirements-scrapers.txt; fi
          python -m pip install requests beautifulsoup4 "psycopg[binary]" python-dotenv playwright

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          python -m playwright install --with-deps chromium

      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "[ERROR] DATABASE_URL secret ontbreekt"
            exit 1
          fi
          echo "[CONFIG] DATABASE_URL is ingesteld"

      - name: Compile Sounds Venlo modules
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/scrapers/usf/jobs/refresh_soundsvenlo_listing_prices.py \
            scripts/scrapers/usf/jobs/detail_soundsvenlo.py \
            scripts/scrapers/usf/jobs/stage_soundsvenlo.py \
            scripts/scrapers/usf/jobs/promote_soundsvenlo.py \
            scripts/scrapers/usf/jobs/quarantine_soundsvenlo.py \
            scripts/scrapers/usf/jobs/run_soundsvenlo_pipeline.py \
            scripts/scrapers/usf/jobs/bootstrap_soundsvenlo_from_csv.py

      - name: Run Sounds Venlo pipeline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/usf-soundsvenlo

          if [ "${{ github.event_name }}" = "schedule" ]; then
            SKIP_LISTING="false"
            LISTING_MAX_PAGES="0"
            FAST_PRICE_SYNC="true"
            WRITE="true"
            RUN_STAGE_PROMOTE="true"
            DETAIL_LIMIT="500"
            STAGE_LIMIT="10000"
            PROMOTE_LIMIT="10000"

            # Large-catalog policy: detail enrichment twice per week.
            # 1 = Monday, 4 = Thursday.
            DAY_OF_WEEK="$(date -u +%u)"
            if [ "$DAY_OF_WEEK" = "1" ] || [ "$DAY_OF_WEEK" = "4" ]; then
              RUN_DETAIL="true"
            else
              RUN_DETAIL="false"
            fi
          else
            SKIP_LISTING="${{ inputs.skip_listing }}"
            LISTING_MAX_PAGES="${{ inputs.listing_max_pages }}"
            RUN_DETAIL="${{ inputs.run_detail }}"
            RUN_STAGE_PROMOTE="${{ inputs.run_stage_promote }}"
            DETAIL_LIMIT="${{ inputs.detail_limit }}"
            STAGE_LIMIT="${{ inputs.stage_limit }}"
            PROMOTE_LIMIT="${{ inputs.promote_limit }}"
            FAST_PRICE_SYNC="${{ inputs.fast_price_sync }}"
            WRITE="${{ inputs.write }}"
          fi

          COMMAND=(
            python -u -m scripts.scrapers.usf.jobs.run_soundsvenlo_pipeline
            --listing-start-page 1
            --listing-max-pages "$LISTING_MAX_PAGES"
            --listing-sleep 0.35
            --max-page-failures 3
            --detail-limit "$DETAIL_LIMIT"
            --detail-sleep 0.50
            --detail-retry-days 30
            --stage-limit "$STAGE_LIMIT"
            --promote-limit "$PROMOTE_LIMIT"
            --quarantine-limit 100
          )

          if [ "$SKIP_LISTING" = "true" ]; then
            COMMAND+=(--skip-listing)
          fi
          if [ "$FAST_PRICE_SYNC" = "true" ]; then
            COMMAND+=(--fast-price-sync)
          fi
          if [ "$RUN_DETAIL" = "true" ]; then
            COMMAND+=(--run-detail)
          fi
          if [ "$RUN_STAGE_PROMOTE" = "true" ]; then
            COMMAND+=(--run-stage-promote)
          fi
          if [ "$WRITE" = "true" ]; then
            COMMAND+=(--write)
          fi

          printf '[WORKFLOW] Command:'
          printf ' %q' "${COMMAND[@]}"
          printf '\n'

          "${COMMAND[@]}" 2>&1 | tee output/usf-soundsvenlo/pipeline.log

      - name: Upload pipeline log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usf-soundsvenlo-${{ github.run_id }}
          path: output/usf-soundsvenlo/**
          if-no-files-found: warn
          retention-days: 14
