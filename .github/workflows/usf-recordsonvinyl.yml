name: USF - RecordsonVinyl

on:
  schedule:
    - cron: "17 3 * * *"

  workflow_dispatch:
    inputs:
      listing_max_pages:
        description: "Aantal listingpagina's; 0 = volledige catalogus"
        required: true
        default: "0"
      fast_price_sync:
        description: "Gebruik snelle bulk price sync vanuit de link registry"
        required: true
        default: true
        type: boolean
      price_only:
        description: "Alleen snelle listing-prijsupdate; sla detail/stage/promote/quarantine over"
        required: true
        default: false
        type: boolean
      detail_limit:
        description: "Maximaal aantal detailpagina's"
        required: true
        default: "500"
      stage_limit:
        description: "Maximaal aantal raw records naar staged_offers"
        required: true
        default: "500"
      promote_limit:
        description: "Maximaal aantal staged offers promoveren"
        required: true
        default: "500"
      quarantine_limit:
        description: "Maximaal aantal incomplete records quarantinen"
        required: true
        default: "100"
      write:
        description: "Werkelijke databasewrites uitvoeren"
        required: true
        default: true
        type: boolean

  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/usf-recordsonvinyl.yml"
      - "scripts/scrapers/usf/**"
      - "scripts/importers/common.py"

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('usf-recordsonvinyl-pr-{0}', github.event.pull_request.number) || 'usf-recordsonvinyl-production' }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate ROV USF pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

          if [ -f requirements-scrapers.txt ]; then
            pip install -r requirements-scrapers.txt
          fi

          pip install requests beautifulsoup4 "psycopg[binary]" python-dotenv

      - name: Compile ROV USF modules
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/scrapers/usf/core/fast_listing_price_sync.py \
            scripts/scrapers/usf/jobs/refresh_recordsonvinyl_listing_prices.py \
            scripts/scrapers/usf/jobs/detail_recordsonvinyl.py \
            scripts/scrapers/usf/jobs/stage_recordsonvinyl.py \
            scripts/scrapers/usf/jobs/promote_staged_offers.py \
            scripts/scrapers/usf/jobs/quarantine_recordsonvinyl.py \
            scripts/scrapers/usf/jobs/run_recordsonvinyl_pipeline.py

      - name: Validate command-line interfaces
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.scrapers.usf.jobs.refresh_recordsonvinyl_listing_prices --help
          python -m scripts.scrapers.usf.jobs.detail_recordsonvinyl --help
          python -m scripts.scrapers.usf.jobs.stage_recordsonvinyl --help
          python -m scripts.scrapers.usf.jobs.promote_staged_offers --help
          python -m scripts.scrapers.usf.jobs.quarantine_recordsonvinyl --help
          python -m scripts.scrapers.usf.jobs.run_recordsonvinyl_pipeline --help

  run:
    name: Run ROV USF pipeline
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

          if [ -f requirements-scrapers.txt ]; then
            pip install -r requirements-scrapers.txt
          fi

          pip install requests beautifulsoup4 "psycopg[binary]" python-dotenv

      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os

          if not os.environ.get("DATABASE_URL"):
              raise SystemExit("[ERROR] GitHub secret DATABASE_URL ontbreekt")

          print("[CONFIG] DATABASE_URL is ingesteld")
          PY

      - name: Run RecordsonVinyl USF pipeline
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p output/usf-recordsonvinyl

          if [ "${{ github.event_name }}" = "schedule" ]; then
            LISTING_MAX_PAGES="0"
            DETAIL_LIMIT="500"
            STAGE_LIMIT="500"
            PROMOTE_LIMIT="500"
            QUARANTINE_LIMIT="100"
            WRITE="true"
            FAST_PRICE_SYNC="true"
            PRICE_ONLY="true"
          else
            LISTING_MAX_PAGES="${{ inputs.listing_max_pages }}"
            DETAIL_LIMIT="${{ inputs.detail_limit }}"
            STAGE_LIMIT="${{ inputs.stage_limit }}"
            PROMOTE_LIMIT="${{ inputs.promote_limit }}"
            QUARANTINE_LIMIT="${{ inputs.quarantine_limit }}"
            WRITE="${{ inputs.write }}"
            FAST_PRICE_SYNC="${{ inputs.fast_price_sync }}"
            PRICE_ONLY="${{ inputs.price_only }}"
          fi

          LISTING_MAX_PAGES="${LISTING_MAX_PAGES:-0}"
          DETAIL_LIMIT="${DETAIL_LIMIT:-500}"
          STAGE_LIMIT="${STAGE_LIMIT:-500}"
          PROMOTE_LIMIT="${PROMOTE_LIMIT:-500}"
          QUARANTINE_LIMIT="${QUARANTINE_LIMIT:-100}"
          WRITE="${WRITE:-true}"
          FAST_PRICE_SYNC="${FAST_PRICE_SYNC:-true}"
          PRICE_ONLY="${PRICE_ONLY:-false}"

          COMMAND=(
            python -u -m scripts.scrapers.usf.jobs.run_recordsonvinyl_pipeline
            --listing-max-pages "$LISTING_MAX_PAGES"
            --detail-limit "$DETAIL_LIMIT"
            --stage-limit "$STAGE_LIMIT"
            --promote-limit "$PROMOTE_LIMIT"
            --quarantine-limit "$QUARANTINE_LIMIT"
          )

          if [ "$FAST_PRICE_SYNC" = "true" ]; then
            COMMAND+=(--fast-price-sync)
          fi

          if [ "$PRICE_ONLY" = "true" ]; then
            COMMAND+=(--skip-detail --skip-stage --skip-promote --skip-quarantine)
          fi

          if [ "$WRITE" = "true" ]; then
            COMMAND+=(--write)
          fi

          printf '[WORKFLOW] Command:'
          printf ' %q' "${COMMAND[@]}"
          printf '\n'

          "${COMMAND[@]}" 2>&1 | tee output/usf-recordsonvinyl/pipeline.log

      - name: Upload pipeline log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usf-recordsonvinyl-${{ github.run_id }}
          path: output/usf-recordsonvinyl/**
          if-no-files-found: warn
