name: Shop - VIP Records

on:
  schedule:
    - cron: "20 3 * * *"
      timezone: "Europe/Amsterdam"
  pull_request:
    paths:
      - ".github/workflows/shop-viprecords-pilot.yml"
      - "scripts/scrapers/viprecords.py"
      - "scripts/importers/import_viprecords.py"
      - "scripts/importers/registry.py"
      - "data/shipping/vinylofy_shipping_rules_nl.csv"
      - "tests/test_viprecords_*.py"
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Listing pages; 0 = full catalog until server stop conditions"
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "0"
      detail_limit:
        description: "Detail pages; all = every discovered product"
        required: true
        default: "3"
        type: choice
        options:
          - "0"
          - "3"
          - "10"
          - "50"
          - "all"
      write:
        description: "Write accepted EAN-gated records to the database; default is dry-run"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: vinylofy-viprecords
  cancel-in-progress: false

jobs:
  validate:
    name: Validate VIP Records scraper and importer
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install scraper and importer dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install beautifulsoup4 requests "psycopg[binary]" python-dotenv

      - name: Compile VIP Records modules
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/scrapers/viprecords.py \
            scripts/importers/import_viprecords.py

      - name: Run focused VIP Records tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_viprecords_scraper \
            tests.test_viprecords_importer

  run:
    name: Run VIP Records listing and detail refresh
    needs: validate
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      VIPRECORDS_DELAY_SECONDS: "0.5"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install scraper and importer dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install beautifulsoup4 requests "psycopg[binary]" python-dotenv

      - name: Configure pilot output path
        shell: bash
        run: |
          set -euo pipefail
          echo "VIPRECORDS_OUTPUT_DIR=$RUNNER_TEMP/viprecords-run" >> "$GITHUB_ENV"

      - name: Configure scheduled or manual run
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            max_pages=0
            detail_limit=50
            write=true
          else
            max_pages="${{ inputs.max_pages }}"
            detail_limit="${{ inputs.detail_limit }}"
            write="${{ inputs.write }}"
          fi
          echo "VIPRECORDS_MAX_PAGES=$max_pages" >> "$GITHUB_ENV"
          echo "VIPRECORDS_DETAIL_LIMIT=$detail_limit" >> "$GITHUB_ENV"
          echo "VIPRECORDS_WRITE=$write" >> "$GITHUB_ENV"

      - name: Restore VIP Records detail checkpoint
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/viprecords-run
          key: viprecords-details-${{ github.run_id }}
          restore-keys: |
            viprecords-details-

      - name: Run full listing and bounded detail refresh
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$VIPRECORDS_OUTPUT_DIR"
          python -u -m scripts.scrapers.viprecords \
            --mode both \
            --max-pages "$VIPRECORDS_MAX_PAGES" \
            --detail-limit "$VIPRECORDS_DETAIL_LIMIT" \
            --delay-seconds "$VIPRECORDS_DELAY_SECONDS" \
            --state-file "$VIPRECORDS_OUTPUT_DIR/viprecords_detail_rotation_state.json" \
            --output-dir "$VIPRECORDS_OUTPUT_DIR"

      - name: Validate write selection
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$VIPRECORDS_WRITE" != "true" ]; then
            exit 0
          fi
          if [ "$VIPRECORDS_DETAIL_LIMIT" = "0" ]; then
            echo "Write-runs vereisen een niet-nul detail_limit zodat EAN-gating records kan accepteren." >&2
            exit 1
          fi
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "DATABASE_URL secret ontbreekt voor een write-run." >&2
            exit 1
          fi

      - name: Run VIP Records importer
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$VIPRECORDS_WRITE" = "true" ]; then
            python -u -m scripts.importers.import_viprecords \
              "$VIPRECORDS_OUTPUT_DIR/viprecords_master.csv" \
              --rejects "$VIPRECORDS_OUTPUT_DIR/rejects.csv" \
              --summary "$VIPRECORDS_OUTPUT_DIR/summary.json"
          else
            python -u -m scripts.importers.import_viprecords \
              "$VIPRECORDS_OUTPUT_DIR/viprecords_master.csv" \
              --dry-run \
              --rejects "$VIPRECORDS_OUTPUT_DIR/rejects.csv" \
              --summary "$VIPRECORDS_OUTPUT_DIR/summary.json"
          fi

      - name: Save VIP Records detail checkpoint
        if: success()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/viprecords-run
          key: viprecords-details-${{ github.run_id }}

      - name: Upload VIP Records run artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: viprecords-run-${{ github.run_id }}
          path: ${{ runner.temp }}/viprecords-run
          if-no-files-found: warn
