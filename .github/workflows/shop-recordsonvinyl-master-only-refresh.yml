name: Shop - RecordsOnVinyl Master Only Refresh

on:
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Max pagina's (0 = tot uitgeput)"
        required: false
        default: "0"
      limit_products:
        description: "Max listing items om te lezen (0 = geen limiet)"
        required: false
        default: "0"
      dry_run:
        description: "Alleen testen, geen database writes"
        required: false
        default: "false"
  schedule:
    - cron: "10 0 * * *"
    - cron: "10 6 * * *"
    - cron: "10 12 * * *"
    - cron: "10 18 * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: vinylofy-recordsonvinyl
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-scrapers.txt ]; then pip install -r requirements-scrapers.txt; fi
          pip install beautifulsoup4 requests "psycopg[binary]" python-dotenv

      - name: Create runtime folders
        shell: bash
        run: |
          mkdir -p data/raw/recordsonvinyl
          mkdir -p output

      - name: Restore latest RecordsOnVinyl state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -u scripts/automation/restore_latest_state_artifact.py \
            --repo "${{ github.repository }}" \
            --target-dir data/raw/recordsonvinyl \
            --artifact-prefix recordsonvinyl-state- \
            --workflow-name "Shop - RecordsOnVinyl Refresh" \
            --workflow-name "Shop - RecordsOnVinyl Crawl" \
            --workflow-name "Shop - RecordsOnVinyl Master Only Refresh"

          echo "Restored files:"
          ls -la data/raw/recordsonvinyl || true

      - name: Validate master CSV
        shell: bash
        run: |
          if [ ! -s data/raw/recordsonvinyl/recordsonvinyl_master.csv ]; then
            echo "recordsonvinyl_master.csv ontbreekt of is leeg."
            echo "Run eerst de crawl workflow om de master state te seeden."
            exit 1
          fi

          echo "Master CSV:"
          ls -lh data/raw/recordsonvinyl/recordsonvinyl_master.csv

      - name: Run master-only RecordsOnVinyl refresh
        shell: bash
        run: |
          set -euo pipefail

          MAX_PAGES="${{ github.event.inputs.max_pages }}"
          LIMIT_PRODUCTS="${{ github.event.inputs.limit_products }}"
          DRY_RUN="${{ github.event.inputs.dry_run }}"

          [ -n "$MAX_PAGES" ] || MAX_PAGES="0"
          [ -n "$LIMIT_PRODUCTS" ] || LIMIT_PRODUCTS="0"
          [ -n "$DRY_RUN" ] || DRY_RUN="false"

          EXTRA_ARGS=""
          if [ "$DRY_RUN" = "true" ]; then
            EXTRA_ARGS="--dry-run"
          fi

          python -u scripts/scrapers/recordsonvinyl_master_only_refresh.py \
            --master-csv data/raw/recordsonvinyl/recordsonvinyl_master.csv \
            --max-pages "$MAX_PAGES" \
            --limit-products "$LIMIT_PRODUCTS" \
            --snapshot output/recordsonvinyl_master_only_refresh_snapshot.csv \
            --audit output/recordsonvinyl_master_only_refresh_audit.csv \
            $EXTRA_ARGS

      - name: Upload master-only refresh artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: recordsonvinyl-master-only-refresh-${{ github.run_id }}
          path: |
            data/raw/recordsonvinyl/*.csv
            output/**/*.csv
            output/**/*.json
          if-no-files-found: warn
