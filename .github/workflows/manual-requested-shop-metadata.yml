name: Apply requested shop metadata once

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: requested-shop-metadata-production
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install database driver
        run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Preflight, migrate, and verify
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          import psycopg

          db_url = os.environ.get('DATABASE_URL', '')
          if not db_url:
              raise SystemExit('DATABASE_URL is missing')

          sql = Path('supabase/migrations/20260927150000_update_requested_shop_metadata.sql').read_text()
          if hashlib.sha256(sql.encode()).hexdigest() != '13f1172b8dac8e94beb86c2b0e6270ca7013be8ff05f4ea4c71a30f813c9374a':
              raise SystemExit('Migration SQL differs from the reviewed file')

          expected = {
              'atthemoviesshop.com': (('NL', None), ('NL', 'online_shop')),
              'blackvinyl.nl': (('NL', None), ('NL', 'physical_record_store')),
              'eustore.everythingjazz.com': (('NL', None), ('NL', 'online_record_store')),
              'fiftiesstore.nl': (('NL', None), ('NL', 'physical_record_store')),
              'groovespin.nl': (('NL', None), ('CZ', 'online_record_store')),
              'hhv.de': (('NL', 'physical_record_store'), ('DE', 'physical_record_store')),
              'imusic.nl': (('NL', 'online_record_store'), ('DK', 'physical_record_store')),
              'platenzaak.nl': (('NL', None), ('NL', 'online_record_store')),
              'suburban.nl': (('NL', None), ('NL', 'record_label')),
          }

          def read_state():
              with psycopg.connect(
                  db_url,
                  options='-c default_transaction_read_only=on',
                  connect_timeout=15,
              ) as conn:
                  with conn.cursor() as cur:
                      cur.execute(
                          "select domain, country, shop_type, is_active from public.shops "
                          "where regexp_replace(lower(btrim(domain)), '^www[.]', '') = any(%s)",
                          (list(expected),),
                      )
                      rows = cur.fetchall()
                      current = {
                          row[0].strip().lower().removeprefix('www.'): (row[1], row[2], row[3])
                          for row in rows
                      }
                      if len(rows) != 9 or set(current) != set(expected):
                          raise SystemExit(f'Unsafe target set: {len(rows)} rows, {len(current)} domains')
                      if any(not row[3] for row in rows):
                          raise SystemExit('An expected shop is inactive')
                      cur.execute(
                          "select pg_get_constraintdef(oid) from pg_constraint "
                          "where conrelid = 'public.shops'::regclass "
                          "and conname = 'shops_shop_type_check'"
                      )
                      constraint = cur.fetchone()
                      if not constraint or 'record_label' not in constraint[0]:
                          raise SystemExit('Unexpected shop type constraint')
                      return current, constraint[0]

          before, constraint = read_state()
          for domain, (old, new) in expected.items():
              if before[domain][:2] not in (old, new):
                  raise SystemExit(f'Unexpected current values for {domain}: {before[domain][:2]}')
          changes = sum(before[domain][:2] != new for domain, (_, new) in expected.items())
          print(f'Preflight: 9 exact active targets; {changes} rows need changes; online_shop allowed: {"online_shop" in constraint}')

          if changes or 'online_shop' not in constraint:
              with psycopg.connect(db_url, autocommit=True, connect_timeout=15) as conn:
                  conn.execute(sql, prepare=False)
              print('Migration SQL committed')
          else:
              print('Already applied; no database write')

          after, constraint = read_state()
          if 'online_shop' not in constraint or any(
              after[domain][:2] != new for domain, (_, new) in expected.items()
          ):
              raise SystemExit('Postcondition failed')
          print('Postcondition: all 9 shop rows have the requested country and shop type')
          PY
