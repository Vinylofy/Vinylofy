name: USF - Everything Jazz Detail

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum aantal detailproducten"
        required: true
        default: "100"
        type: string
      write:
        description: "Detail, stage, promote en quarantine daadwerkelijk schrijven"
        required: true
        default: false
        type: boolean
      debug:
        description: "Uitgebreide detaildiagnostiek"
        required: true
        default: false
        type: boolean

  schedule:
    # Dinsdag en vrijdag:
    # 06:27 Nederlandse zomertijd / 05:27 wintertijd
    - cron: "27 4 * * 2,5"

permissions:
  contents: read

concurrency:
  group: vinylofy-everythingjazz
  cancel-in-progress: false

jobs:
  detail:
    name: Detail, stage, promote and quarantine
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip

          if [[ -f requirements.txt ]]; then
            python -m pip install -r requirements.txt
          fi

          if [[ -f requirements-scrapers.txt ]]; then
            python -m pip install -r requirements-scrapers.txt
          fi

          python -m pip install \
            requests \
            beautifulsoup4 \
            "psycopg[binary]" \
            python-dotenv

      - name: Resolve configuration
        id: config
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "limit=250" >> "$GITHUB_OUTPUT"
            echo "write=true" >> "$GITHUB_OUTPUT"
            echo "debug=false" >> "$GITHUB_OUTPUT"
          else
            echo "limit=${{ inputs.limit }}" >> "$GITHUB_OUTPUT"
            echo "write=${{ inputs.write }}" >> "$GITHUB_OUTPUT"
            echo "debug=${{ inputs.debug }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate configuration and modules
        shell: bash
        run: |
          LIMIT="${{ steps.config.outputs.limit }}"

          if [[ -z "${DATABASE_URL:-}" ]]; then
            echo "[ERROR] GitHub Secret DATABASE_URL ontbreekt."
            exit 1
          fi

          if ! [[ "$LIMIT" =~ ^[0-9]+$ ]] || (( LIMIT < 1 || LIMIT > 1000 )); then
            echo "[ERROR] limit moet tussen 1 en 1000 liggen."
            exit 1
          fi

          python -m py_compile \
            scripts/scrapers/usf/jobs/everythingjazz_product_type.py \
            scripts/scrapers/usf/jobs/detail_everythingjazz.py \
            scripts/scrapers/usf/jobs/stage_everythingjazz.py \
            scripts/scrapers/usf/jobs/promote_everythingjazz.py \
            scripts/scrapers/usf/jobs/quarantine_everythingjazz.py

          python -m scripts.scrapers.usf.jobs.detail_everythingjazz --help >/dev/null
          python -m scripts.scrapers.usf.jobs.stage_everythingjazz --help >/dev/null
          python -m scripts.scrapers.usf.jobs.promote_everythingjazz --help >/dev/null
          python -m scripts.scrapers.usf.jobs.quarantine_everythingjazz --help >/dev/null

      - name: Run Everything Jazz detail pipeline
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p output/everythingjazz

          LIMIT="${{ steps.config.outputs.limit }}"
          WRITE="${{ steps.config.outputs.write }}"
          DEBUG="${{ steps.config.outputs.debug }}"

          LOG="output/everythingjazz/detail-pipeline-${{ github.run_id }}.log"
          OUT="output/everythingjazz/detail-${{ github.run_id }}.json"

          DETAIL_CMD=(
            python -u -m
            scripts.scrapers.usf.jobs.detail_everythingjazz
            --limit "$LIMIT"
            --retry-days 30
            --refresh-days 180
            --max-missing-ean-attempts 3
            --sleep 0.35
            --timeout 45
            --output "$OUT"
          )

          if [[ "$WRITE" == "true" ]]; then
            DETAIL_CMD+=(--write)
          fi

          if [[ "$DEBUG" == "true" ]]; then
            DETAIL_CMD+=(--debug)
          fi

          echo "Event: ${{ github.event_name }}" | tee "$LOG"
          echo "Limit: $LIMIT" | tee -a "$LOG"
          echo "Write: $WRITE" | tee -a "$LOG"

          printf "Detail command:" | tee -a "$LOG"
          printf " %q" "${DETAIL_CMD[@]}" | tee -a "$LOG"
          echo | tee -a "$LOG"

          "${DETAIL_CMD[@]}" 2>&1 | tee -a "$LOG"

          STAGE_CMD=(
            python -u -m
            scripts.scrapers.usf.jobs.stage_everythingjazz
            --limit "$LIMIT"
          )

          PROMOTE_CMD=(
            python -u -m
            scripts.scrapers.usf.jobs.promote_everythingjazz
            --limit "$LIMIT"
          )

          QUARANTINE_CMD=(
            python -u -m
            scripts.scrapers.usf.jobs.quarantine_everythingjazz
            --limit "$LIMIT"
          )

          if [[ "$WRITE" == "true" ]]; then
            STAGE_CMD+=(--write)
            PROMOTE_CMD+=(--write)
            QUARANTINE_CMD+=(--write)
          fi

          echo | tee -a "$LOG"
          echo "== STAGE ==" | tee -a "$LOG"
          "${STAGE_CMD[@]}" 2>&1 | tee -a "$LOG"

          echo | tee -a "$LOG"
          echo "== PROMOTE ==" | tee -a "$LOG"
          "${PROMOTE_CMD[@]}" 2>&1 | tee -a "$LOG"

          echo | tee -a "$LOG"
          echo "== QUARANTINE ==" | tee -a "$LOG"
          "${QUARANTINE_CMD[@]}" 2>&1 | tee -a "$LOG"

      - name: Upload detail pipeline log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: everythingjazz-detail-${{ github.run_id }}
          path: output/everythingjazz/
          if-no-files-found: warn
          retention-days: 7
