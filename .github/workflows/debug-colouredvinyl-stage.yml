name: Debug - Coloured Vinyl Stage

run-name: Coloured Vinyl staging dry-run

on:
  push:

permissions:
  contents: read

concurrency:
  group: debug-colouredvinyl-stage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stage-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

          if [ -f requirements-scrapers.txt ]; then
            python -m pip install -r requirements-scrapers.txt
          fi

          python -m pip install \
            "psycopg[binary]" \
            python-dotenv

      - name: Validate module
        shell: bash
        run: |
          set -euo pipefail

          python -m py_compile \
            scripts/scrapers/usf/jobs/stage_colouredvinyl.py

          python -m \
            scripts.scrapers.usf.jobs.stage_colouredvinyl \
            --help >/dev/null

          grep -q \
            'SHOP_ID = "colouredvinyl"' \
            scripts/scrapers/usf/jobs/stage_colouredvinyl.py

          grep -q \
            'stage_latest_raw_snapshots' \
            scripts/scrapers/usf/jobs/stage_colouredvinyl.py

      - name: Validate database secret
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${DATABASE_URL:-}" ]; then
            echo "[ERROR] DATABASE_URL ontbreekt."
            exit 1
          fi

      - name: Inspect staging candidates
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p output/usf-colouredvinyl

          python - <<'PY' \
            2>&1 | tee \
              output/usf-colouredvinyl/stage-baseline.log
          import json
          import os
          from pathlib import Path

          import psycopg
          from psycopg.rows import dict_row


          database_url = os.environ["DATABASE_URL"]

          with psycopg.connect(
              database_url,
              row_factory=dict_row,
          ) as connection:
              with connection.cursor() as cursor:
                  cursor.execute(
                      """
                      with latest_raw as (
                        select distinct on (
                          r.shop_id,
                          r.source_url
                        )
                          r.*
                        from public.raw_shop_scrapes r
                        where r.shop_id = 'colouredvinyl'
                        order by
                          r.shop_id,
                          r.source_url,
                          r.scraped_at desc nulls last,
                          r.id desc
                      ),
                      candidates as (
                        select
                          r.*,
                          l.payload as listing_payload
                        from latest_raw r
                        left join public.staged_offers s
                          on s.raw_scrape_id = r.id
                        left join public.shop_product_links l
                          on l.shop_id = r.shop_id
                         and trim(
                               trailing '/'
                               from split_part(
                                 l.source_url,
                                 '?',
                                 1
                               )
                             ) =
                             trim(
                               trailing '/'
                               from split_part(
                                 r.source_url,
                                 '?',
                                 1
                               )
                             )
                        where s.id is null
                          and r.ean_raw is not null
                          and r.price_raw is not null
                      )
                      select
                        count(*)::int as candidates,
                        count(*) filter (
                          where ean_raw ~
                            '^(?:[0-9]{8}|[0-9]{12,14})$'
                        )::int as valid_eans,
                        count(*) filter (
                          where title_raw is null
                             or btrim(title_raw) = ''
                        )::int as missing_titles,
                        count(*) filter (
                          where image_url_raw is not null
                        )::int as image_rows,
                        count(*) filter (
                          where availability_raw
                                = 'in_stock'
                        )::int as in_stock_rows,
                        count(*) filter (
                          where availability_raw
                                is distinct from
                                listing_payload
                                  ->>'availability'
                        )::int
                          as availability_mismatches,
                        count(*) filter (
                          where nullif(
                                  price_raw,
                                  ''
                                )::numeric
                                is distinct from
                                nullif(
                                  listing_payload
                                    ->>'price',
                                  ''
                                )::numeric
                        )::int as price_mismatches,
                        count(*) filter (
                          where coalesce(
                                  listing_payload
                                    ->>'url_collision',
                                  'false'
                                ) = 'true'
                        )::int as collision_rows,
                        count(*) filter (
                          where coalesce(
                                  listing_payload
                                    ->>'publish_eligible',
                                  'true'
                                ) = 'false'
                        )::int as blocked_rows
                      from candidates
                      """
                  )

                  summary = dict(
                      cursor.fetchone()
                  )

                  cursor.execute(
                      """
                      select count(*)::int as staged_before
                      from public.staged_offers
                      where shop_id = 'colouredvinyl'
                      """
                  )

                  summary.update(
                      dict(cursor.fetchone())
                  )

          print(
              json.dumps(
                  summary,
                  indent=2,
                  ensure_ascii=False,
              )
          )

          Path(
              "output/usf-colouredvinyl/"
              "stage-baseline.json"
          ).write_text(
              json.dumps(
                  summary,
                  indent=2,
                  ensure_ascii=False,
              ),
              encoding="utf-8",
          )

          if int(summary["candidates"]) < 1:
              raise SystemExit(
                  "Geen stagingkandidaten gevonden."
              )

          if (
              int(summary["valid_eans"])
              != int(summary["candidates"])
          ):
              raise SystemExit(
                  "Niet alle stagingkandidaten "
                  "hebben een geldige EAN."
              )

          for key in (
              "missing_titles",
              "image_rows",
              "availability_mismatches",
              "price_mismatches",
              "collision_rows",
              "blocked_rows",
          ):
              if int(summary[key]) != 0:
                  raise SystemExit(
                      f"Onveilige stagingkandidaten: "
                      f"{key}={summary[key]}"
                  )

          if (
              int(summary["in_stock_rows"])
              != int(summary["candidates"])
          ):
              raise SystemExit(
                  "Niet alle kandidaten zijn "
                  "volgens de listing op voorraad."
              )

          if int(summary["staged_before"]) != 0:
              raise SystemExit(
                  "Er bestaan al Coloured Vinyl "
                  "staged offers."
              )

          print(
              "[OK] Raw stagingkandidaten zijn "
              "veilig en listing-consistent."
          )
          PY

      - name: Run staging dry-run
        shell: bash
        run: |
          set -euo pipefail

          python -u -m \
            scripts.scrapers.usf.jobs.stage_colouredvinyl \
            --limit 100 \
            2>&1 | tee \
              output/usf-colouredvinyl/stage.log

      - name: Validate dry-run
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY' \
            2>&1 | tee \
              output/usf-colouredvinyl/stage-analysis.log
          import json
          import os
          from pathlib import Path

          import psycopg
          from psycopg.rows import dict_row


          baseline = json.loads(
              Path(
                  "output/usf-colouredvinyl/"
                  "stage-baseline.json"
              ).read_text(encoding="utf-8")
          )

          diagnostics = json.loads(
              Path(
                  "output/usf-colouredvinyl/"
                  "stage-diagnostics.json"
              ).read_text(encoding="utf-8")
          )

          summary = diagnostics["summary"]
          items = diagnostics["items"]

          print(
              json.dumps(
                  {
                      "baseline": baseline,
                      "stage_summary": summary,
                      "sample_count": len(items),
                  },
                  indent=2,
                  ensure_ascii=False,
              )
          )

          expected = int(
              baseline["candidates"]
          )

          if int(summary["candidates"]) != expected:
              raise SystemExit(
                  "Stagingresultaat wijkt af "
                  "van databasebaseline."
              )

          if int(summary["inserted"]) != 0:
              raise SystemExit(
                  "Dry-run heeft staged offers geschreven."
              )

          if int(summary["skipped"]) != 0:
              raise SystemExit(
                  "Dry-run heeft kandidaten overgeslagen."
              )

          if summary["write"] is not False:
              raise SystemExit(
                  "Stagingdry-run heeft write=true."
              )

          if len(items) != expected:
              raise SystemExit(
                  "Niet alle kandidaten staan "
                  "in de diagnostics."
              )

          unsafe = [
              item
              for item in items
              if (
                  not item.get("ean_normalized")
                  or item.get("price") is None
                  or item.get("availability")
                     != "in_stock"
                  or item.get("stage_reason")
                     is not None
                  or item.get("staged_offer_id")
                     is not None
              )
          ]

          if unsafe:
              raise SystemExit(
                  "Onveilige stagingitems: "
                  + json.dumps(
                      unsafe[:3],
                      ensure_ascii=False,
                  )
              )

          database_url = os.environ["DATABASE_URL"]

          with psycopg.connect(
              database_url,
              row_factory=dict_row,
          ) as connection:
              with connection.cursor() as cursor:
                  cursor.execute(
                      """
                      select count(*)::int as staged_after
                      from public.staged_offers
                      where shop_id = 'colouredvinyl'
                      """
                  )

                  staged_after = int(
                      cursor.fetchone()[
                          "staged_after"
                      ]
                  )

          if staged_after != int(
              baseline["staged_before"]
          ):
              raise SystemExit(
                  "Dry-run heeft staged_offers gewijzigd."
              )

          print(
              "[OK] Stagingdry-run is volledig "
              "read-only en veilig."
          )
          PY

      - name: Upload staging diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: colouredvinyl-stage-dry-run
          path: output/usf-colouredvinyl/**
          if-no-files-found: error
          retention-days: 7
