name: USF - Coloured Vinyl Detail

run-name: >-
  Coloured Vinyl detail • write=${{ inputs.write }} •
  limit=${{ inputs.limit }}

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Aantal registrylinks; maximaal 100 per write"
        required: true
        default: "1"
        type: string

      retry_days:
        description: "Dagen voor een detailretry"
        required: true
        default: "30"
        type: string

      sleep_seconds:
        description: "Pauze tussen detailrequests"
        required: true
        default: "0.35"
        type: string

      write:
        description: "Schrijf raw detail-snapshots"
        required: true
        default: false
        type: boolean

      minimum_stored:
        description: "Minimaal verwacht aantal nieuwe raw snapshots"
        required: true
        default: "0"
        type: string

      minimum_ean_found:
        description: "Minimaal verwacht aantal gevonden EAN's"
        required: true
        default: "0"
        type: string

      write_confirmation:
        description: >-
          Bij write=true exact WRITE_COLOUREDVINYL_DETAIL invullen
        required: false
        default: ""
        type: string

permissions:
  contents: read

# Dezelfde groep als de listingworkflow:
# listing- en detailwrites kunnen zo niet overlappen.
concurrency:
  group: usf-colouredvinyl-listing-production
  cancel-in-progress: false

jobs:
  detail:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

          if [ -f requirements-scrapers.txt ]; then
            python -m pip install -r requirements-scrapers.txt
          fi

          python -m pip install \
            requests \
            beautifulsoup4 \
            "psycopg[binary]" \
            python-dotenv

      - name: Validate module
        shell: bash
        run: |
          set -euo pipefail

          python -m py_compile \
            scripts/scrapers/usf/jobs/detail_colouredvinyl.py

          python -m \
            scripts.scrapers.usf.jobs.detail_colouredvinyl \
            --help >/dev/null

          grep -q \
            'listing_price_and_' \
            scripts/scrapers/usf/jobs/detail_colouredvinyl.py

          grep -q \
            'image_url_raw=None' \
            scripts/scrapers/usf/jobs/detail_colouredvinyl.py

          grep -q \
            'url_collision' \
            scripts/scrapers/usf/jobs/detail_colouredvinyl.py

      - name: Validate request
        shell: bash
        run: |
          set -euo pipefail

          LIMIT="${{ inputs.limit }}"
          RETRY_DAYS="${{ inputs.retry_days }}"
          SLEEP_SECONDS="${{ inputs.sleep_seconds }}"
          MINIMUM_STORED="${{ inputs.minimum_stored }}"
          MINIMUM_EAN="${{ inputs.minimum_ean_found }}"
          WRITE="${{ inputs.write }}"
          CONFIRMATION="${{ inputs.write_confirmation }}"

          for VALUE in \
            "$LIMIT" \
            "$RETRY_DAYS" \
            "$MINIMUM_STORED" \
            "$MINIMUM_EAN"
          do
            if ! [[ "$VALUE" =~ ^[0-9]+$ ]]; then
              echo "[ERROR] numerieke input is ongeldig: $VALUE"
              exit 1
            fi
          done

          if [ "$LIMIT" -lt 1 ] || [ "$LIMIT" -gt 100 ]; then
            echo "[ERROR] limit moet tussen 1 en 100 liggen."
            exit 1
          fi

          if [ "$RETRY_DAYS" -lt 1 ]; then
            echo "[ERROR] retry_days moet minimaal 1 zijn."
            exit 1
          fi

          if [ "$MINIMUM_STORED" -gt "$LIMIT" ]; then
            echo "[ERROR] minimum_stored is groter dan limit."
            exit 1
          fi

          if [ "$MINIMUM_EAN" -gt "$LIMIT" ]; then
            echo "[ERROR] minimum_ean_found is groter dan limit."
            exit 1
          fi

          if ! [[ "$SLEEP_SECONDS" =~ ^[0-9]+([.][0-9]+)?$ ]]; then
            echo "[ERROR] sleep_seconds is ongeldig."
            exit 1
          fi

          if [ -z "${DATABASE_URL:-}" ]; then
            echo "[ERROR] DATABASE_URL ontbreekt."
            exit 1
          fi

          if [ "$WRITE" = "true" ]; then
            if [ "$CONFIRMATION" != "WRITE_COLOUREDVINYL_DETAIL" ]; then
              echo "[ERROR] ongeldige writebevestiging."
              exit 1
            fi
          fi

          echo "[OK] detailaanvraag gevalideerd."

      - name: Capture database baseline
        id: baseline
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import os

          import psycopg
          from psycopg.rows import dict_row


          database_url = os.environ["DATABASE_URL"]

          with psycopg.connect(
              database_url,
              row_factory=dict_row,
          ) as connection:
              with connection.cursor() as cursor:
                  cursor.execute(
                      """
                      select
                        clock_timestamp() as baseline_at,
                        (
                          select count(*)::int
                          from public.raw_shop_scrapes
                          where shop_id = 'colouredvinyl'
                        ) as raw_count,
                        (
                          select count(*)::int
                          from public.staged_offers
                          where shop_id = 'colouredvinyl'
                        ) as staged_count,
                        (
                          select count(*)::int
                          from public.prices p
                          join public.shops s
                            on s.id = p.shop_id
                          where s.domain = 'colouredvinyl.nl'
                        ) as public_price_count
                      """
                  )

                  row = dict(cursor.fetchone())

          output_path = os.environ["GITHUB_OUTPUT"]

          with open(
              output_path,
              "a",
              encoding="utf-8",
          ) as output:
              output.write(
                  "baseline_at="
                  + row["baseline_at"].isoformat()
                  + "\n"
              )
              output.write(
                  f"raw_count={row['raw_count']}\n"
              )
              output.write(
                  f"staged_count={row['staged_count']}\n"
              )
              output.write(
                  "public_price_count="
                  f"{row['public_price_count']}\n"
              )

          print(row)
          PY

      - name: Run detail crawler
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p output/usf-colouredvinyl

          COMMAND=(
            python -u -m
            scripts.scrapers.usf.jobs.detail_colouredvinyl
            --limit "${{ inputs.limit }}"
            --retry-days "${{ inputs.retry_days }}"
            --sleep "${{ inputs.sleep_seconds }}"
          )

          if [ "${{ inputs.write }}" = "true" ]; then
            COMMAND+=(--write)
          fi

          printf '[WORKFLOW] Command:'
          printf ' %q' "${COMMAND[@]}"
          printf '\n'

          "${COMMAND[@]}" \
            2>&1 | tee \
              output/usf-colouredvinyl/detail.log

      - name: Validate diagnostics
        shell: bash
        env:
          INPUT_WRITE: ${{ inputs.write }}
          INPUT_LIMIT: ${{ inputs.limit }}
          MINIMUM_STORED: ${{ inputs.minimum_stored }}
          MINIMUM_EAN: ${{ inputs.minimum_ean_found }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          from pathlib import Path


          path = Path(
              "output/usf-colouredvinyl/"
              "detail-diagnostics.json"
          )

          if not path.exists():
              raise SystemExit(
                  "detail-diagnostics.json ontbreekt."
              )

          data = json.loads(
              path.read_text(encoding="utf-8")
          )

          summary = data.get("summary", {})

          write_expected = (
              os.environ["INPUT_WRITE"].lower()
              == "true"
          )

          print(
              json.dumps(
                  summary,
                  indent=2,
                  ensure_ascii=False,
              )
          )

          if bool(summary.get("write")) != write_expected:
              raise SystemExit(
                  "write-status in diagnostics wijkt af."
              )

          if summary.get("price_authority") != "listing":
              raise SystemExit(
                  "Detailprijs is ten onrechte leidend."
              )

          if (
              summary.get("availability_authority")
              != "listing"
          ):
              raise SystemExit(
                  "Detailvoorraad is ten onrechte leidend."
              )

          if summary.get("image_stored") is not False:
              raise SystemExit(
                  "Er is een shopafbeelding opgeslagen."
              )

          stored = int(summary.get("stored", 0))
          ean_found = int(summary.get("ean_found", 0))

          if stored < int(os.environ["MINIMUM_STORED"]):
              raise SystemExit(
                  "Minder raw snapshots dan verwacht."
              )

          if ean_found < int(os.environ["MINIMUM_EAN"]):
              raise SystemExit(
                  "Minder EAN's dan verwacht."
              )

          if stored > int(os.environ["INPUT_LIMIT"]):
              raise SystemExit(
                  "Meer snapshots dan de ingestelde limiet."
              )
          PY

      - name: Verify database write isolation
        if: ${{ inputs.write }}
        shell: bash
        env:
          BASELINE_AT: ${{ steps.baseline.outputs.baseline_at }}
          BEFORE_RAW_COUNT: ${{ steps.baseline.outputs.raw_count }}
          BEFORE_STAGED_COUNT: ${{ steps.baseline.outputs.staged_count }}
          BEFORE_PUBLIC_PRICE_COUNT: ${{ steps.baseline.outputs.public_price_count }}
        run: |
          set -euo pipefail

          python - <<'PY' \
            2>&1 | tee \
              output/usf-colouredvinyl/database-verification.log
          import json
          import os
          from pathlib import Path

          import psycopg
          from psycopg.rows import dict_row


          diagnostics = json.loads(
              Path(
                  "output/usf-colouredvinyl/"
                  "detail-diagnostics.json"
              ).read_text(encoding="utf-8")
          )

          summary = diagnostics["summary"]
          stored = int(summary.get("stored", 0))
          ean_found = int(
              summary.get("ean_found", 0)
          )

          baseline_at = os.environ["BASELINE_AT"]
          before_raw = int(
              os.environ["BEFORE_RAW_COUNT"]
          )
          before_staged = int(
              os.environ["BEFORE_STAGED_COUNT"]
          )
          before_public_prices = int(
              os.environ[
                  "BEFORE_PUBLIC_PRICE_COUNT"
              ]
          )

          database_url = os.environ["DATABASE_URL"]

          with psycopg.connect(
              database_url,
              row_factory=dict_row,
          ) as connection:
              with connection.cursor() as cursor:
                  cursor.execute(
                      """
                      select count(*)::int as raw_count
                      from public.raw_shop_scrapes
                      where shop_id = 'colouredvinyl'
                      """
                  )
                  after_raw = int(
                      cursor.fetchone()["raw_count"]
                  )

                  cursor.execute(
                      """
                      select count(*)::int as staged_count
                      from public.staged_offers
                      where shop_id = 'colouredvinyl'
                      """
                  )
                  after_staged = int(
                      cursor.fetchone()["staged_count"]
                  )

                  cursor.execute(
                      """
                      select count(*)::int
                        as public_price_count
                      from public.prices p
                      join public.shops s
                        on s.id = p.shop_id
                      where s.domain = 'colouredvinyl.nl'
                      """
                  )
                  after_public_prices = int(
                      cursor.fetchone()[
                          "public_price_count"
                      ]
                  )

                  cursor.execute(
                      """
                      with new_rows as (
                        select
                          r.*,
                          trim(
                            trailing '/'
                            from split_part(
                              r.source_url,
                              '?',
                              1
                            )
                          ) as source_url_norm
                        from public.raw_shop_scrapes r
                        where r.shop_id = 'colouredvinyl'
                          and r.scraped_at
                              >= %s::timestamptz
                          and r.payload->>'source'
                              = 'detail_colouredvinyl'
                      ),
                      joined as (
                        select
                          n.*,
                          l.payload as listing_payload,
                          l.last_detail_scraped_at
                        from new_rows n
                        left join
                          public.shop_product_links l
                          on l.shop_id = n.shop_id
                         and trim(
                               trailing '/'
                               from split_part(
                                 l.source_url,
                                 '?',
                                 1
                               )
                             ) = n.source_url_norm
                      )
                      select
                        count(*)::int as new_rows,
                        count(*) filter (
                          where ean_raw is not null
                        )::int as rows_with_ean,
                        count(*) filter (
                          where ean_raw is not null
                            and ean_raw !~
                              '^(?:[0-9]{8}|[0-9]{12,14})$'
                        )::int as invalid_eans,
                        count(*) filter (
                          where image_url_raw is not null
                        )::int as image_rows,
                        count(*) filter (
                          where nullif(
                                  price_raw,
                                  ''
                                )::numeric
                                is distinct from
                                nullif(
                                  listing_payload->>'price',
                                  ''
                                )::numeric
                        )::int as price_mismatches,
                        count(*) filter (
                          where availability_raw
                                is distinct from
                                listing_payload->>'availability'
                        )::int as availability_mismatches,
                        count(*) filter (
                          where coalesce(
                                  listing_payload
                                    ->>'url_collision',
                                  'false'
                                ) = 'true'
                        )::int as collision_rows,
                        count(*) filter (
                          where coalesce(
                                  listing_payload
                                    ->>'publish_eligible',
                                  'true'
                                ) = 'false'
                        )::int as blocked_rows,
                        count(*) filter (
                          where last_detail_scraped_at
                                is null
                        )::int as unmarked_links
                      from joined
                      """,
                      (baseline_at,),
                  )

                  new_stats = dict(
                      cursor.fetchone()
                  )

                  cursor.execute(
                      """
                      select
                        r.id::text,
                        r.source_url,
                        r.source_product_id,
                        r.title_raw,
                        r.ean_raw,
                        r.price_raw,
                        r.availability_raw,
                        r.image_url_raw,
                        r.payload->>'artist' as artist,
                        r.payload->>'title' as title,
                        r.payload->>'format' as format,
                        r.payload->>'colour' as colour,
                        r.payload->>'label' as label,
                        r.payload->>'release_date'
                          as release_date,
                        r.scraped_at,
                        l.last_detail_scraped_at
                      from public.raw_shop_scrapes r
                      left join
                        public.shop_product_links l
                        on l.shop_id = r.shop_id
                       and trim(
                             trailing '/'
                             from split_part(
                               l.source_url,
                               '?',
                               1
                             )
                           ) =
                           trim(
                             trailing '/'
                             from split_part(
                               r.source_url,
                               '?',
                               1
                             )
                           )
                      where r.shop_id = 'colouredvinyl'
                        and r.scraped_at
                            >= %s::timestamptz
                        and r.payload->>'source'
                            = 'detail_colouredvinyl'
                      order by r.scraped_at desc
                      limit 10
                      """,
                      (baseline_at,),
                  )

                  samples = [
                      dict(row)
                      for row in cursor.fetchall()
                  ]

          result = {
              "diagnostics": {
                  "stored": stored,
                  "ean_found": ean_found,
              },
              "counts": {
                  "raw_before": before_raw,
                  "raw_after": after_raw,
                  "raw_delta": (
                      after_raw - before_raw
                  ),
                  "staged_before": before_staged,
                  "staged_after": after_staged,
                  "public_prices_before": (
                      before_public_prices
                  ),
                  "public_prices_after": (
                      after_public_prices
                  ),
              },
              "new_rows": new_stats,
              "samples": samples,
          }

          print(
              json.dumps(
                  result,
                  indent=2,
                  ensure_ascii=False,
                  default=str,
              )
          )

          Path(
              "output/usf-colouredvinyl/"
              "database-verification.json"
          ).write_text(
              json.dumps(
                  result,
                  indent=2,
                  ensure_ascii=False,
                  default=str,
              ),
              encoding="utf-8",
          )

          if after_raw - before_raw != stored:
              raise SystemExit(
                  "Raw-delta wijkt af van stored."
              )

          if int(new_stats["new_rows"]) != stored:
              raise SystemExit(
                  "Aantal nieuwe detailrows wijkt af."
              )

          if int(new_stats["rows_with_ean"]) != ean_found:
              raise SystemExit(
                  "EAN-aantal wijkt af van diagnostics."
              )

          for key in (
              "invalid_eans",
              "image_rows",
              "price_mismatches",
              "availability_mismatches",
              "collision_rows",
              "blocked_rows",
              "unmarked_links",
          ):
              if int(new_stats[key]) != 0:
                  raise SystemExit(
                      f"Onveilige detailwrite: {key}="
                      f"{new_stats[key]}"
                  )

          if after_staged != before_staged:
              raise SystemExit(
                  "Detailworkflow heeft staged_offers gewijzigd."
              )

          if (
              after_public_prices
              != before_public_prices
          ):
              raise SystemExit(
                  "Detailworkflow heeft publieke prijzen gewijzigd."
              )

          print(
              "[OK] Raw detailwrite is geïsoleerd "
              "en veilig gevalideerd."
          )
          PY

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: colouredvinyl-detail-${{ github.run_id }}
          path: output/usf-colouredvinyl/**
          if-no-files-found: warn
          retention-days: 14
