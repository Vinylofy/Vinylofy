name: Correct Variaworld shop type once

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: variaworld-shop-type-production
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install database driver
        run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Preflight, migrate, and verify
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          import psycopg

          db_url = os.environ.get('DATABASE_URL', '')
          if not db_url:
              raise SystemExit('DATABASE_URL is missing')

          sql = Path('supabase/migrations/20260927130000_correct_variaworld_shop_type.sql').read_text()
          if hashlib.sha256(sql.encode()).hexdigest() != '11fa5fa9c1ef3246757d1a3f1e11954645ac0253624e3ae2bd43e99f323e5a42':
              raise SystemExit('Migration SQL differs from the reviewed file')

          def read_state():
              with psycopg.connect(
                  db_url,
                  options='-c default_transaction_read_only=on',
                  connect_timeout=15,
              ) as conn:
                  with conn.cursor() as cur:
                      cur.execute(
                          "select domain, is_active, shop_type from public.shops "
                          "where regexp_replace(lower(btrim(domain)), '^www[.]', '') = 'variaworld.nl'"
                      )
                      rows = cur.fetchall()
                      if len(rows) != 1 or not rows[0][1]:
                          raise SystemExit(f'Unsafe Variaworld target set: {len(rows)} rows or inactive')
                      if rows[0][2] not in ('online_record_store', 'physical_record_store'):
                          raise SystemExit(f'Unexpected Variaworld type: {rows[0][2]}')
                      return rows[0][2]

          before = read_state()
          print(f'Preflight: exactly one active Variaworld row; type: {before}')
          if before == 'online_record_store':
              with psycopg.connect(db_url, autocommit=True, connect_timeout=15) as conn:
                  conn.execute(sql, prepare=False)
              print('Correction SQL committed')
          else:
              print('Already corrected; no database write')

          after = read_state()
          if after != 'physical_record_store':
              raise SystemExit(f'Postcondition failed: {after}')
          print('Postcondition: Variaworld is physical_record_store')
          PY
