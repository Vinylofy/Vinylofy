name: USF My Record Store

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Pipeline mode"
        required: true
        default: "price-only"
        type: choice
        options:
          - price-only
          - detail
          - full
      listing_max_pages:
        description: "0 = until stop condition"
        required: true
        default: "0"
      detail_limit:
        description: "Detail batch size"
        required: true
        default: "25"
      write:
        description: "Write changes"
        required: true
        default: true
        type: boolean
  schedule:
    - cron: "17 4 * * *"
    - cron: "23 */2 * * *"

jobs:
  usf-myrecordstore:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Run pipeline
        run: |
          MODE="${{ github.event.inputs.mode || 'price-only' }}"
          LISTING_MAX_PAGES="${{ github.event.inputs.listing_max_pages || '0' }}"
          DETAIL_LIMIT="${{ github.event.inputs.detail_limit || '25' }}"
          WRITE="${{ github.event.inputs.write || 'true' }}"

          CMD=(python -u -m scripts.scrapers.usf.jobs.run_myrecordstore_pipeline
            --mode "$MODE"
            --listing-max-pages "$LISTING_MAX_PAGES"
            --detail-limit "$DETAIL_LIMIT"
          )

          if [ "$WRITE" = "true" ]; then
            CMD+=(--write)
          fi

          "${CMD[@]}"
