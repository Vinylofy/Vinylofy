name: USF My Record Store

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Pipeline mode"
        required: true
        default: "price-only"
        type: choice
        options:
          - price-only
          - detail
          - full
      listing_max_pages:
        description: "Listing pages; 0 = until scraper stop condition"
        required: true
        default: "25"
      detail_limit:
        description: "Detail batch size"
        required: true
        default: "25"
      write:
        description: "Write changes"
        required: true
        default: true
        type: boolean

  schedule:
    # Daily full listing refresh + fast price sync.
    - cron: "17 4 * * *"

    # Detail enrichment batch every 2 hours.
    - cron: "23 */2 * * *"

jobs:
  myrecordstore:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install requests beautifulsoup4 psycopg[binary] python-dotenv

      - name: Resolve mode
        id: resolve
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "17 4 * * *" ]; then
              echo "mode=price-only" >> "$GITHUB_OUTPUT"
              echo "listing_max_pages=0" >> "$GITHUB_OUTPUT"
              echo "detail_limit=25" >> "$GITHUB_OUTPUT"
              echo "write=true" >> "$GITHUB_OUTPUT"
            else
              echo "mode=detail" >> "$GITHUB_OUTPUT"
              echo "listing_max_pages=25" >> "$GITHUB_OUTPUT"
              echo "detail_limit=25" >> "$GITHUB_OUTPUT"
              echo "write=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
            echo "listing_max_pages=${{ inputs.listing_max_pages }}" >> "$GITHUB_OUTPUT"
            echo "detail_limit=${{ inputs.detail_limit }}" >> "$GITHUB_OUTPUT"
            echo "write=${{ inputs.write }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Compile My Record Store jobs
        run: |
          python -m py_compile \
            scripts/scrapers/usf/jobs/refresh_myrecordstore_listing_prices.py \
            scripts/scrapers/usf/jobs/detail_myrecordstore.py \
            scripts/scrapers/usf/jobs/stage_myrecordstore.py \
            scripts/scrapers/usf/jobs/promote_myrecordstore.py \
            scripts/scrapers/usf/jobs/sync_myrecordstore_listing_prices.py \
            scripts/scrapers/usf/jobs/run_myrecordstore_pipeline.py

      - name: Run My Record Store pipeline
        shell: bash
        run: |
          CMD=(python -u -m scripts.scrapers.usf.jobs.run_myrecordstore_pipeline
            --mode "${{ steps.resolve.outputs.mode }}"
            --listing-max-pages "${{ steps.resolve.outputs.listing_max_pages }}"
            --detail-limit "${{ steps.resolve.outputs.detail_limit }}"
            --stage-limit "${{ steps.resolve.outputs.detail_limit }}"
            --promote-limit "${{ steps.resolve.outputs.detail_limit }}"
          )

          if [ "${{ steps.resolve.outputs.write }}" = "true" ]; then
            CMD+=(--write)
          fi

          echo "[ACTION] ${CMD[*]}"
          "${CMD[@]}"
