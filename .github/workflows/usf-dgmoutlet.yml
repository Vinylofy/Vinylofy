name: USF - DGM Outlet

on:
  schedule:
    - cron: "40 1 * * *"
      timezone: "Europe/Amsterdam"

  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/usf-dgmoutlet.yml"
      - "scripts/scrapers/dgmoutlet.py"
      - "scripts/scrapers/usf/**"
      - "scripts/importers/common.py"
      - "scripts/importers/import_dgmoutlet.py"

  workflow_dispatch:
    inputs:
      skip_discovery:
        description: "Bestaande registry gebruiken en discovery overslaan"
        required: true
        default: true
        type: boolean

      skip_requeue:
        description: "Stale-link requeue overslaan"
        required: true
        default: false
        type: boolean

      discovery_start_page:
        description: "Eerste DGM-listingpagina"
        required: true
        default: "1"

      discovery_max_pages:
        description: "Aantal listingpagina's; 0 = volledige listing"
        required: true
        default: "2"

      requeue_stale_hours:
        description: "Minimale ouderdom voor prijsrefresh"
        required: true
        default: "24"

      requeue_limit:
        description: "Maximaal aantal stale links requeueën"
        required: true
        default: "500"

      requeue_target_queue:
        description: "Queue maximaal aanvullen tot dit aantal"
        required: true
        default: "500"

      materialize_limit:
        description: "Maximaal aantal queued links naar raw snapshots"
        required: true
        default: "25"

      stage_limit:
        description: "Maximaal aantal raw snapshots naar staged_offers"
        required: true
        default: "25"

      promote_limit:
        description: "Maximaal aantal staged offers promoveren"
        required: true
        default: "25"

      quarantine_limit:
        description: "Maximaal aantal promote errors quarantinen"
        required: true
        default: "100"

      write:
        description: "Werkelijke registry-, raw-, staging- en publieke writes uitvoeren"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.event_name == 'pull_request'
        && format('usf-dgmoutlet-pr-{0}', github.event.pull_request.number)
        || 'usf-dgmoutlet-production' }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate DGM USF pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-scrapers.txt

      - name: Install dependencies
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

          if [ -f requirements-scrapers.txt ]; then
            pip install -r requirements-scrapers.txt
          fi

          pip install \
            requests \
            beautifulsoup4 \
            "psycopg[binary]" \
            python-dotenv \

      - name: Compile DGM USF modules
        shell: bash
        run: |
          set -euo pipefail

          python -m py_compile \
            scripts/scrapers/dgmoutlet.py \
            scripts/scrapers/usf/core/db.py \
            scripts/scrapers/usf/core/link_registry.py \
            scripts/scrapers/usf/core/raw_materializer.py \
            scripts/scrapers/usf/core/requeue.py \
            scripts/scrapers/usf/core/staging.py \
            scripts/scrapers/usf/core/promotion.py \
            scripts/scrapers/usf/core/promotion_writer.py \
            scripts/scrapers/usf/core/quarantine.py \
            scripts/scrapers/usf/jobs/discover_dgmoutlet.py \
            scripts/scrapers/usf/jobs/requeue_stale_links.py \
            scripts/scrapers/usf/jobs/materialize_dgmoutlet_listing.py \
            scripts/scrapers/usf/jobs/stage_dgmoutlet.py \
            scripts/scrapers/usf/jobs/promote_dgmoutlet.py \
            scripts/scrapers/usf/jobs/quarantine_dgmoutlet.py \
            scripts/scrapers/usf/jobs/run_dgmoutlet_pipeline.py

      - name: Validate command-line interfaces
        shell: bash
        run: |
          set -euo pipefail

          python -m scripts.scrapers.usf.jobs.discover_dgmoutlet --help
          python -m scripts.scrapers.usf.jobs.requeue_stale_links --help
          python -m scripts.scrapers.usf.jobs.materialize_dgmoutlet_listing --help
          python -m scripts.scrapers.usf.jobs.stage_dgmoutlet --help
          python -m scripts.scrapers.usf.jobs.promote_dgmoutlet --help
          python -m scripts.scrapers.usf.jobs.quarantine_dgmoutlet --help
          python -m scripts.scrapers.usf.jobs.run_dgmoutlet_pipeline --help

  run:
    name: Run DGM USF pipeline
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-scrapers.txt

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

          if [ -f requirements-scrapers.txt ]; then
            pip install -r requirements-scrapers.txt
          fi

          pip install \
            requests \
            beautifulsoup4 \
            "psycopg[binary]" \
            python-dotenv \

      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import os

          if not os.environ.get("DATABASE_URL"):
              raise SystemExit(
                  "[ERROR] GitHub secret DATABASE_URL ontbreekt"
              )

          print("[CONFIG] DATABASE_URL is ingesteld")
          PY

      - name: Run DGM Outlet USF pipeline
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p output/usf-dgmoutlet

          if [ "${{ github.event_name }}" = "schedule" ]; then
            SKIP_DISCOVERY="false"
            SKIP_REQUEUE="false"
            DISCOVERY_START_PAGE="1"
            DISCOVERY_MAX_PAGES="25"
            REQUEUE_STALE_HOURS="24"
            REQUEUE_LIMIT="250"
            REQUEUE_TARGET_QUEUE="250"
            MATERIALIZE_LIMIT="250"
            STAGE_LIMIT="250"
            PROMOTE_LIMIT="250"
            QUARANTINE_LIMIT="100"
            WRITE="true"
          else
            SKIP_DISCOVERY="${{ inputs.skip_discovery }}"
            SKIP_REQUEUE="${{ inputs.skip_requeue }}"
            DISCOVERY_START_PAGE="${{ inputs.discovery_start_page }}"
            DISCOVERY_MAX_PAGES="${{ inputs.discovery_max_pages }}"
            REQUEUE_STALE_HOURS="${{ inputs.requeue_stale_hours }}"
            REQUEUE_LIMIT="${{ inputs.requeue_limit }}"
            REQUEUE_TARGET_QUEUE="${{ inputs.requeue_target_queue }}"
            MATERIALIZE_LIMIT="${{ inputs.materialize_limit }}"
            STAGE_LIMIT="${{ inputs.stage_limit }}"
            PROMOTE_LIMIT="${{ inputs.promote_limit }}"
            QUARANTINE_LIMIT="${{ inputs.quarantine_limit }}"
            WRITE="${{ inputs.write }}"
          fi

          COMMAND=(
            python
            -u
            -m
            scripts.scrapers.usf.jobs.run_dgmoutlet_pipeline
            --discovery-start-page
            "$DISCOVERY_START_PAGE"
            --discovery-max-pages
            "$DISCOVERY_MAX_PAGES"
            --requeue-stale-hours
            "$REQUEUE_STALE_HOURS"
            --requeue-limit
            "$REQUEUE_LIMIT"
            --requeue-target-queue
            "$REQUEUE_TARGET_QUEUE"
            --materialize-limit
            "$MATERIALIZE_LIMIT"
            --stage-limit
            "$STAGE_LIMIT"
            --promote-limit
            "$PROMOTE_LIMIT"
            --quarantine-limit
            "$QUARANTINE_LIMIT"
          )

          if [ "$SKIP_DISCOVERY" = "true" ]; then
            COMMAND+=(--skip-discovery)
          fi

          if [ "$SKIP_REQUEUE" = "true" ]; then
            COMMAND+=(--skip-requeue)
          fi

          if [ "$WRITE" = "true" ]; then
            COMMAND+=(--write)
          fi

          printf '[WORKFLOW] Command:'
          printf ' %q' "${COMMAND[@]}"
          printf '\n'

          "${COMMAND[@]}" \
            2>&1 | tee output/usf-dgmoutlet/pipeline.log

      - name: Upload pipeline log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: usf-dgmoutlet-${{ github.run_id }}
          path: output/usf-dgmoutlet/**
          if-no-files-found: warn
