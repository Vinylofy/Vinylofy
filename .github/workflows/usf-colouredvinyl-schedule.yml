name: USF - Coloured Vinyl Schedule

on:
  schedule:
    # Dagelijks listing en prijzen om 06:37 Nederlandse tijd.
    - cron: "37 6 * * *"
      timezone: "Europe/Amsterdam"

    # Dinsdag en vrijdag details om 08:17 Nederlandse tijd.
    - cron: "17 8 * * 2,5"
      timezone: "Europe/Amsterdam"

    # Dinsdag en vrijdag stage/promote om 09:47 Nederlandse tijd.
    - cron: "47 9 * * 2,5"
      timezone: "Europe/Amsterdam"

  workflow_dispatch:
    inputs:
      scope:
        description: "Welke Coloured Vinyl-run moet worden gestart?"
        required: true
        default: listing
        type: choice
        options:
          - listing
          - detail
          - stage-promote

permissions:
  contents: read
  actions: write

concurrency:
  group: usf-colouredvinyl-schedule
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch Coloured Vinyl pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Determine scope
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          MANUAL_SCOPE: ${{ inputs.scope }}
        run: |
          set -Eeuo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            scope="$MANUAL_SCOPE"
          else
            case "$EVENT_SCHEDULE" in
              "37 6 * * *")
                scope="listing"
                ;;
              "17 8 * * 2,5")
                scope="detail"
                ;;
              "47 9 * * 2,5")
                scope="stage-promote"
                ;;
              *)
                echo "Onbekend schedule: $EVENT_SCHEDULE"
                exit 1
                ;;
            esac
          fi

          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "Geselecteerde scope: $scope"

      - name: Dispatch USF Coloured Vinyl Pipeline
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SCOPE: ${{ steps.scope.outputs.scope }}
        run: |
          set -Eeuo pipefail

          jq -n \
            --arg scope "$SCOPE" \
            '{
              ref: "main",
              inputs: {
                mode: "write",
                scope: $scope,
                write_confirmation: "WRITE_COLOUREDVINYL_PIPELINE",
                listing_start_page: "1",
                listing_max_pages: "0",
                page_size: "50",
                listing_sleep_seconds: "0.25"
              }
            }' > /tmp/dispatch.json

          echo "Dispatch scope: $SCOPE"

          gh api \
            --method POST \
            "/repos/${GH_REPO}/actions/workflows/usf-colouredvinyl.yml/dispatches" \
            --input /tmp/dispatch.json

          echo "Coloured Vinyl-pipeline succesvol aangevraagd."
