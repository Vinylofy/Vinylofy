name: USF - 3345 Batched

on:
  schedule:
    - cron: "37 1,9,17 * * *"

  workflow_dispatch:
    inputs:
      pages:
        description: "Maximumaantal pagina's"
        required: true
        default: "3"
        type: string

      write:
        description: "Databasewrites uitvoeren"
        required: true
        default: false
        type: boolean

      debug:
        description: "Uitgebreide logging"
        required: true
        default: true
        type: boolean

      reset_cycle:
        description: "Cursor terugzetten naar pagina 1"
        required: true
        default: false
        type: boolean

      run_detail:
        description: "Na de batch 25 details verwerken"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: usf-shop3345-production
  cancel-in-progress: false

jobs:
  batch:
    name: Run resumable 3345 batch
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

          if [ -f requirements-scrapers.txt ]; then
            pip install -r requirements-scrapers.txt
          fi

          pip install \
            requests \
            beautifulsoup4 \
            "psycopg[binary]" \
            python-dotenv

      - name: Validate local scraper interface
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${DATABASE_URL:-}" ]; then
            echo "[ERROR] DATABASE_URL ontbreekt."
            exit 1
          fi

          python -m py_compile \
            scripts/scrapers/usf/jobs/refresh_shop3345_listing_prices.py \
            scripts/scrapers/usf/jobs/refresh_shop3345_batched.py \
            scripts/scrapers/usf/jobs/run_shop3345_pipeline.py

          HELP_OUTPUT="$(
            python -m \
              scripts.scrapers.usf.jobs.refresh_shop3345_listing_prices \
              --help 2>&1
          )"

          for OPTION in \
            "--start-page" \
            "--max-pages" \
            "--sleep" \
            "--max-page-failures" \
            "--write"
          do
            grep -q -- "$OPTION" <<<"$HELP_OUTPUT" || {
              echo "[ERROR] Ontbrekende scraperoptie: $OPTION"
              echo "$HELP_OUTPUT"
              exit 1
            }
          done

          python -m \
            scripts.scrapers.usf.jobs.refresh_shop3345_batched \
            --help >/dev/null

      - name: Run batch
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p output/usf-shop3345

          if [ "${{ github.event_name }}" = "schedule" ]; then
            PAGES="50"
            WRITE="true"
            DEBUG="false"
            RESET="false"
            RUN_DETAIL="false"
          else
            PAGES="${{ inputs.pages }}"
            WRITE="${{ inputs.write }}"
            DEBUG="${{ inputs.debug }}"
            RESET="${{ inputs.reset_cycle }}"
            RUN_DETAIL="${{ inputs.run_detail }}"
          fi

          COMMAND=(
            python
            -u
            -m
            scripts.scrapers.usf.jobs.refresh_shop3345_batched
            --pages "$PAGES"
            --page-sleep 5
            --max-page-failures 6
          )

          if [ "$WRITE" = "true" ]; then
            COMMAND+=(--write)
          fi

          if [ "$DEBUG" = "true" ]; then
            COMMAND+=(--debug)
          fi

          if [ "$RESET" = "true" ]; then
            COMMAND+=(--reset-cycle)
          fi

          printf '[WORKFLOW] Command:'
          printf ' %q' "${COMMAND[@]}"
          printf '\n'

          "${COMMAND[@]}" 2>&1 |
            tee output/usf-shop3345/batch.log

          if \
            [ "$RUN_DETAIL" = "true" ] &&
            [ "$WRITE" = "true" ]
          then
            python -u -m \
              scripts.scrapers.usf.jobs.run_shop3345_pipeline \
              --skip-listing \
              --run-detail \
              --detail-limit 25 \
              --detail-sleep 0.75 \
              --detail-retry-days 30 \
              --stage-limit 25 \
              --promote-limit 25 \
              --quarantine-limit 100 \
              --write 2>&1 |
              tee output/usf-shop3345/detail.log
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usf-shop3345-${{ github.run_id }}
          path: output/usf-shop3345/**
          if-no-files-found: warn
          retention-days: 14
