name: USF - Coloured Vinyl Listing

run-name: >-
  Coloured Vinyl listing • write=${{ inputs.write }} •
  max-pages=${{ inputs.max_pages }}

on:
  workflow_dispatch:
    inputs:
      max_pages:
        description: "0 = volledige catalogus; beperkte scan delist nooit"
        required: true
        default: "2"
        type: string

      debug:
        description: "Uitgebreide listingdiagnostiek en HTML bewaren"
        required: true
        default: false
        type: boolean

      write:
        description: "Registry-, shop- en listingprijswrites uitvoeren"
        required: true
        default: false
        type: boolean

      write_confirmation:
        description: >-
          Bij write=true exact WRITE_COLOUREDVINYL invullen
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: usf-colouredvinyl-listing-production
  cancel-in-progress: false

jobs:
  listing:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

          if [ -f requirements-scrapers.txt ]; then
            python -m pip install -r requirements-scrapers.txt
          fi

          python -m pip install \
            requests \
            beautifulsoup4 \
            "psycopg[binary]" \
            python-dotenv

      - name: Validate module
        shell: bash
        run: |
          set -euo pipefail

          python -m py_compile \
            scripts/scrapers/usf/jobs/refresh_colouredvinyl_listing_prices.py

          python -m \
            scripts.scrapers.usf.jobs.refresh_colouredvinyl_listing_prices \
            --help >/dev/null

          grep -q \
            'shared_product_url_multiple_variants' \
            scripts/scrapers/usf/jobs/refresh_colouredvinyl_listing_prices.py

          grep -q \
            '"publish_eligible": False' \
            scripts/scrapers/usf/jobs/refresh_colouredvinyl_listing_prices.py

      - name: Validate write request
        shell: bash
        run: |
          set -euo pipefail

          MAX_PAGES="${{ inputs.max_pages }}"
          WRITE="${{ inputs.write }}"
          CONFIRMATION="${{ inputs.write_confirmation }}"

          if ! [[ "$MAX_PAGES" =~ ^[0-9]+$ ]]; then
            echo "[ERROR] max_pages moet een geheel getal zijn."
            exit 1
          fi

          if [ "$WRITE" = "true" ]; then
            if [ "$MAX_PAGES" != "0" ]; then
              echo "[ERROR] Writes zijn alleen toegestaan na een volledige scan."
              echo "[ERROR] Gebruik max_pages=0."
              exit 1
            fi

            if [ "$CONFIRMATION" != "WRITE_COLOUREDVINYL" ]; then
              echo "[ERROR] Ongeldige writebevestiging."
              exit 1
            fi

            if [ -z "${DATABASE_URL:-}" ]; then
              echo "[ERROR] DATABASE_URL secret ontbreekt."
              exit 1
            fi
          fi

          echo "[OK] Aanvraag is veilig gevalideerd."

      - name: Run listing crawler
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p output/usf-colouredvinyl

          COMMAND=(
            python -u -m
            scripts.scrapers.usf.jobs.refresh_colouredvinyl_listing_prices
            --start-page 1
            --max-pages "${{ inputs.max_pages }}"
            --sleep 0.35
            --max-page-failures 3
          )

          if [ "${{ inputs.debug }}" = "true" ]; then
            COMMAND+=(--debug)
          fi

          if [ "${{ inputs.write }}" = "true" ]; then
            COMMAND+=(--write)
          fi

          printf '[WORKFLOW] Command:'
          printf ' %q' "${COMMAND[@]}"
          printf '\n'

          "${COMMAND[@]}" \
            2>&1 | tee output/usf-colouredvinyl/listing.log

      - name: Verify written registry
        if: ${{ inputs.write }}
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY' \
            2>&1 | tee output/usf-colouredvinyl/database-verification.log
          from __future__ import annotations

          import json
          import os
          from pathlib import Path

          import psycopg
          from psycopg.rows import dict_row


          database_url = os.environ.get("DATABASE_URL")

          if not database_url:
              raise SystemExit(
                  "DATABASE_URL ontbreekt."
              )


          with psycopg.connect(
              database_url,
              row_factory=dict_row,
          ) as connection:
              with connection.cursor() as cursor:
                  cursor.execute(
                      """
                      select
                        count(*)::int as total,
                        count(*) filter (
                          where status = 'active'
                        )::int as active,
                        count(*) filter (
                          where payload->>'url_collision'
                                = 'true'
                        )::int as url_collisions,
                        count(*) filter (
                          where payload->>'publish_eligible'
                                = 'false'
                        )::int as blocked_from_publish,
                        count(*) filter (
                          where payload->>'price'
                                is not null
                        )::int as links_with_listing_price,
                        count(*) filter (
                          where payload->>'url_collision'
                                = 'true'
                            and payload->>'price'
                                is not null
                        )::int as unsafe_collision_prices
                      from public.shop_product_links
                      where shop_id = 'colouredvinyl'
                      """
                  )

                  links = dict(cursor.fetchone())

                  cursor.execute(
                      """
                      select
                        id::text,
                        name,
                        domain,
                        country,
                        is_active
                      from public.shops
                      where domain = 'colouredvinyl.nl'
                      limit 1
                      """
                  )

                  shop_row = cursor.fetchone()
                  shop = (
                      dict(shop_row)
                      if shop_row is not None
                      else None
                  )

                  cursor.execute(
                      """
                      select count(*)::int as public_prices
                      from public.prices p
                      join public.shops s
                        on s.id = p.shop_id
                      where s.domain = 'colouredvinyl.nl'
                      """
                  )

                  prices = dict(cursor.fetchone())


          result = {
              "links": links,
              "shop": shop,
              "prices": prices,
          }

          print(
              json.dumps(
                  result,
                  indent=2,
                  ensure_ascii=False,
                  default=str,
              )
          )

          Path(
              "output/usf-colouredvinyl/"
              "database-verification.json"
          ).write_text(
              json.dumps(
                  result,
                  indent=2,
                  ensure_ascii=False,
                  default=str,
              ),
              encoding="utf-8",
          )

          if links["active"] <= 0:
              raise SystemExit(
                  "Geen actieve Coloured Vinyl-links geschreven."
              )

          if links["unsafe_collision_prices"] != 0:
              raise SystemExit(
                  "URL-collision heeft onveilig een prijs gekregen."
              )

          if shop is None:
              raise SystemExit(
                  "Coloured Vinyl-shoprecord ontbreekt."
              )

          print(
              "[OK] Registrywrite en collisionbeveiliging "
              "zijn gevalideerd."
          )
          PY

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: colouredvinyl-listing-${{ github.run_id }}
          path: output/usf-colouredvinyl/**
          if-no-files-found: warn
          retention-days: 14
