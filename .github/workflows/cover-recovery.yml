name: Cover Recovery

on:
  workflow_dispatch:
    inputs:
      product_id:
        description: "Exact products.id voor gecontroleerd herstel"
        required: true
        type: string
      candidate_id:
        description: "Exact product_cover_candidates.id"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: vinylofy-cover-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      VINYLOFY_COVER_STORAGE_BUCKET: ${{ vars.VINYLOFY_COVER_STORAGE_BUCKET }}
      VINYLOFY_COVER_STORAGE_PREFIX: ${{ vars.VINYLOFY_COVER_STORAGE_PREFIX }}
      VINYLOFY_COVER_SHOP_PRIORITY_JSON: ${{ vars.VINYLOFY_COVER_SHOP_PRIORITY_JSON }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install --requirement requirements-cover.txt

      - name: Prepare folders
        shell: bash
        run: |
          mkdir -p output/cover_pipeline

      - name: Run pinned cover recovery
        shell: bash
        run: |
          PRODUCT_ID="${{ github.event.inputs.product_id }}"
          CANDIDATE_ID="${{ github.event.inputs.candidate_id }}"

          python -u scripts/maintenance/cover_worker.py \
            --mode publish \
            --limit 1 \
            --product-id "$PRODUCT_ID" \
            --candidate-id "$CANDIDATE_ID" \
            --output-json output/cover_pipeline/cover_recovery_summary.json

      - name: Write run summary
        if: always()
        shell: bash
        run: |
          python scripts/maintenance/cover_workflow_summary.py \
            --title "Cover Recovery" \
            --status "${{ job.status }}" \
            --summary-json \
              "Cover recovery=output/cover_pipeline/cover_recovery_summary.json" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: cover-recovery-${{ github.run_id }}
          path: output/cover_pipeline/**/*.json
          if-no-files-found: warn
