name: USF - Coloured Vinyl Stage

run-name: >-
  Coloured Vinyl stage • write=${{ inputs.write }} •
  limit=${{ inputs.limit }}

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximumaantal raw snapshots"
        required: true
        default: "1"
        type: string

      write:
        description: "Schrijf staged_offers"
        required: true
        default: false
        type: boolean

      minimum_inserted:
        description: "Minimaal verwacht aantal inserts"
        required: true
        default: "0"
        type: string

      write_confirmation:
        description: >-
          Bij write=true exact WRITE_COLOUREDVINYL_STAGE invullen
        required: false
        default: ""
        type: string

permissions:
  contents: read

# Listing-, detail- en stagingwrites mogen niet overlappen.
concurrency:
  group: usf-colouredvinyl-listing-production
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

          if [ -f requirements-scrapers.txt ]; then
            python -m pip install -r requirements-scrapers.txt
          fi

          python -m pip install \
            "psycopg[binary]" \
            python-dotenv

      - name: Validate module
        shell: bash
        run: |
          set -euo pipefail

          python -m py_compile \
            scripts/scrapers/usf/jobs/stage_colouredvinyl.py

          python -m \
            scripts.scrapers.usf.jobs.stage_colouredvinyl \
            --help >/dev/null

          grep -q \
            'SHOP_ID = "colouredvinyl"' \
            scripts/scrapers/usf/jobs/stage_colouredvinyl.py

          grep -q \
            'stage_latest_raw_snapshots' \
            scripts/scrapers/usf/jobs/stage_colouredvinyl.py

      - name: Validate request
        shell: bash
        run: |
          set -euo pipefail

          LIMIT="${{ inputs.limit }}"
          WRITE="${{ inputs.write }}"
          MINIMUM_INSERTED="${{ inputs.minimum_inserted }}"
          CONFIRMATION="${{ inputs.write_confirmation }}"

          if ! [[ "$LIMIT" =~ ^[0-9]+$ ]]; then
            echo "[ERROR] limit is ongeldig."
            exit 1
          fi

          if ! [[ "$MINIMUM_INSERTED" =~ ^[0-9]+$ ]]; then
            echo "[ERROR] minimum_inserted is ongeldig."
            exit 1
          fi

          if [ "$LIMIT" -lt 1 ] || [ "$LIMIT" -gt 100 ]; then
            echo "[ERROR] limit moet tussen 1 en 100 liggen."
            exit 1
          fi

          if [ "$MINIMUM_INSERTED" -gt "$LIMIT" ]; then
            echo "[ERROR] minimum_inserted is groter dan limit."
            exit 1
          fi

          if [ -z "${DATABASE_URL:-}" ]; then
            echo "[ERROR] DATABASE_URL ontbreekt."
            exit 1
          fi

          if [ "$WRITE" = "true" ]; then
            if [ "$CONFIRMATION" != "WRITE_COLOUREDVINYL_STAGE" ]; then
              echo "[ERROR] ongeldige writebevestiging."
              exit 1
            fi
          fi

          echo "[OK] stagingaanvraag gevalideerd."

      - name: Capture database baseline
        id: baseline
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p output/usf-colouredvinyl

          python - <<'PY' \
            2>&1 | tee \
              output/usf-colouredvinyl/stage-baseline.log
          import json
          import os
          from pathlib import Path

          import psycopg
          from psycopg.rows import dict_row


          database_url = os.environ["DATABASE_URL"]

          with psycopg.connect(
              database_url,
              row_factory=dict_row,
          ) as connection:
              with connection.cursor() as cursor:
                  cursor.execute(
                      """
                      select
                        clock_timestamp() as baseline_at,
                        (
                          select count(*)::int
                          from public.raw_shop_scrapes
                          where shop_id = 'colouredvinyl'
                        ) as raw_count,
                        (
                          select count(*)::int
                          from public.staged_offers
                          where shop_id = 'colouredvinyl'
                        ) as staged_count,
                        (
                          select count(*)::int
                          from public.prices p
                          join public.shops s
                            on s.id = p.shop_id
                          where s.domain = 'colouredvinyl.nl'
                        ) as public_price_count
                      """
                  )

                  row = dict(cursor.fetchone())

          output_path = os.environ["GITHUB_OUTPUT"]

          with open(
              output_path,
              "a",
              encoding="utf-8",
          ) as output:
              output.write(
                  "baseline_at="
                  + row["baseline_at"].isoformat()
                  + "\n"
              )
              output.write(
                  f"raw_count={row['raw_count']}\n"
              )
              output.write(
                  f"staged_count={row['staged_count']}\n"
              )
              output.write(
                  "public_price_count="
                  f"{row['public_price_count']}\n"
              )

          Path(
              "output/usf-colouredvinyl/"
              "stage-baseline.json"
          ).write_text(
              json.dumps(
                  row,
                  indent=2,
                  default=str,
              ),
              encoding="utf-8",
          )

          print(row)
          PY

      - name: Run staging
        shell: bash
        run: |
          set -euo pipefail

          COMMAND=(
            python -u -m
            scripts.scrapers.usf.jobs.stage_colouredvinyl
            --limit "${{ inputs.limit }}"
          )

          if [ "${{ inputs.write }}" = "true" ]; then
            COMMAND+=(--write)
          fi

          printf '[WORKFLOW] Command:'
          printf ' %q' "${COMMAND[@]}"
          printf '\n'

          "${COMMAND[@]}" \
            2>&1 | tee \
              output/usf-colouredvinyl/stage.log

      - name: Validate diagnostics
        shell: bash
        env:
          INPUT_LIMIT: ${{ inputs.limit }}
          INPUT_WRITE: ${{ inputs.write }}
          MINIMUM_INSERTED: ${{ inputs.minimum_inserted }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          from pathlib import Path


          path = Path(
              "output/usf-colouredvinyl/"
              "stage-diagnostics.json"
          )

          if not path.exists():
              raise SystemExit(
                  "stage-diagnostics.json ontbreekt."
              )

          diagnostics = json.loads(
              path.read_text(encoding="utf-8")
          )

          summary = diagnostics["summary"]
          items = diagnostics["items"]

          write_expected = (
              os.environ["INPUT_WRITE"].lower()
              == "true"
          )

          print(
              json.dumps(
                  summary,
                  indent=2,
                  ensure_ascii=False,
              )
          )

          if bool(summary["write"]) != write_expected:
              raise SystemExit(
                  "write-status wijkt af."
              )

          if int(summary["candidates"]) > int(
              os.environ["INPUT_LIMIT"]
          ):
              raise SystemExit(
                  "Meer kandidaten dan de limiet."
              )

          if int(summary["inserted"]) < int(
              os.environ["MINIMUM_INSERTED"]
          ):
              raise SystemExit(
                  "Minder staged offers geschreven "
                  "dan verwacht."
              )

          if int(summary["skipped"]) != 0:
              raise SystemExit(
                  "Minimaal één stagingkandidaat "
                  "is overgeslagen."
              )

          if len(items) != int(summary["candidates"]):
              raise SystemExit(
                  "Diagnostics bevatten niet alle items."
              )

          unsafe = [
              item
              for item in items
              if (
                  not item.get("ean_normalized")
                  or item.get("price") is None
                  or item.get("availability")
                     != "in_stock"
                  or item.get("stage_reason")
                     is not None
              )
          ]

          if unsafe:
              raise SystemExit(
                  "Onveilige stagingitems: "
                  + json.dumps(
                      unsafe[:3],
                      ensure_ascii=False,
                  )
              )

          if write_expected:
              missing_ids = [
                  item
                  for item in items
                  if not item.get("staged_offer_id")
              ]

              if missing_ids:
                  raise SystemExit(
                      "Geschreven item mist staged_offer_id."
                  )
          PY

      - name: Verify database write isolation
        if: ${{ always() && inputs.write }}
        shell: bash
        env:
          BASELINE_AT: ${{ steps.baseline.outputs.baseline_at }}
          BEFORE_RAW_COUNT: ${{ steps.baseline.outputs.raw_count }}
          BEFORE_STAGED_COUNT: ${{ steps.baseline.outputs.staged_count }}
          BEFORE_PUBLIC_PRICE_COUNT: ${{ steps.baseline.outputs.public_price_count }}
        run: |
          set -euo pipefail

          python - <<'PY' \
            2>&1 | tee \
              output/usf-colouredvinyl/stage-database-verification.log
          import json
          import os
          from pathlib import Path

          import psycopg
          from psycopg.rows import dict_row


          diagnostics = json.loads(
              Path(
                  "output/usf-colouredvinyl/"
                  "stage-diagnostics.json"
              ).read_text(encoding="utf-8")
          )

          inserted = int(
              diagnostics["summary"]["inserted"]
          )

          baseline_at = os.environ["BASELINE_AT"]
          before_raw = int(
              os.environ["BEFORE_RAW_COUNT"]
          )
          before_staged = int(
              os.environ["BEFORE_STAGED_COUNT"]
          )
          before_public_prices = int(
              os.environ[
                  "BEFORE_PUBLIC_PRICE_COUNT"
              ]
          )

          database_url = os.environ["DATABASE_URL"]

          with psycopg.connect(
              database_url,
              row_factory=dict_row,
          ) as connection:
              with connection.cursor() as cursor:
                  cursor.execute(
                      """
                      select count(*)::int as raw_count
                      from public.raw_shop_scrapes
                      where shop_id = 'colouredvinyl'
                      """
                  )

                  after_raw = int(
                      cursor.fetchone()["raw_count"]
                  )

                  cursor.execute(
                      """
                      select count(*)::int as staged_count
                      from public.staged_offers
                      where shop_id = 'colouredvinyl'
                      """
                  )

                  after_staged = int(
                      cursor.fetchone()["staged_count"]
                  )

                  cursor.execute(
                      """
                      select count(*)::int
                        as public_price_count
                      from public.prices p
                      join public.shops s
                        on s.id = p.shop_id
                      where s.domain = 'colouredvinyl.nl'
                      """
                  )

                  after_public_prices = int(
                      cursor.fetchone()[
                          "public_price_count"
                      ]
                  )

                  cursor.execute(
                      """
                      with new_staged as (
                        select
                          s.*,
                          r.ean_raw,
                          r.price_raw,
                          r.availability_raw,
                          r.image_url_raw,
                          r.payload as raw_payload
                        from public.staged_offers s
                        join public.raw_shop_scrapes r
                          on r.id = s.raw_scrape_id
                        where s.shop_id = 'colouredvinyl'
                          and s.created_at
                              >= %s::timestamptz
                      )
                      select
                        count(*)::int as new_rows,
                        count(*) filter (
                          where ean_normalized ~
                            '^(?:[0-9]{8}|[0-9]{12,14})$'
                        )::int as valid_eans,
                        count(*) filter (
                          where price is null
                        )::int as missing_prices,
                        count(*) filter (
                          where availability
                                <> 'in_stock'
                        )::int as non_in_stock_rows,
                        count(*) filter (
                          where image_url is not null
                        )::int as staged_image_rows,
                        count(*) filter (
                          where image_url_raw is not null
                        )::int as raw_image_rows,
                        count(*) filter (
                          where stage_status <> 'staged'
                        )::int as wrong_status_rows,
                        count(*) filter (
                          where price is distinct from
                                nullif(
                                  price_raw,
                                  ''
                                )::numeric
                        )::int as raw_price_mismatches,
                        count(*) filter (
                          where availability
                                is distinct from
                                availability_raw
                        )::int
                          as raw_availability_mismatches,
                        count(*) filter (
                          where coalesce(
                                  raw_payload
                                    ->'listing_payload'
                                    ->>'url_collision',
                                  'false'
                                ) = 'true'
                        )::int as collision_rows,
                        count(*) filter (
                          where coalesce(
                                  raw_payload
                                    ->'listing_payload'
                                    ->>'publish_eligible',
                                  'true'
                                ) = 'false'
                        )::int as blocked_rows
                      from new_staged
                      """,
                      (baseline_at,),
                  )

                  new_stats = dict(
                      cursor.fetchone()
                  )

                  cursor.execute(
                      """
                      select
                        s.id::text as staged_offer_id,
                        s.raw_scrape_id::text,
                        s.source_url,
                        s.source_product_id,
                        s.ean_normalized,
                        s.ean_match_key,
                        s.price,
                        s.currency,
                        s.availability,
                        s.image_url,
                        s.stage_status,
                        s.stage_reason,
                        s.created_at,
                        r.title_raw
                      from public.staged_offers s
                      join public.raw_shop_scrapes r
                        on r.id = s.raw_scrape_id
                      where s.shop_id = 'colouredvinyl'
                        and s.created_at
                            >= %s::timestamptz
                      order by s.created_at asc
                      limit 10
                      """,
                      (baseline_at,),
                  )

                  samples = [
                      dict(row)
                      for row in cursor.fetchall()
                  ]

          result = {
              "counts": {
                  "raw_before": before_raw,
                  "raw_after": after_raw,
                  "staged_before": before_staged,
                  "staged_after": after_staged,
                  "staged_delta": (
                      after_staged - before_staged
                  ),
                  "public_prices_before": (
                      before_public_prices
                  ),
                  "public_prices_after": (
                      after_public_prices
                  ),
              },
              "diagnostics": {
                  "inserted": inserted,
              },
              "new_rows": new_stats,
              "samples": samples,
          }

          print(
              json.dumps(
                  result,
                  indent=2,
                  ensure_ascii=False,
                  default=str,
              )
          )

          Path(
              "output/usf-colouredvinyl/"
              "stage-database-verification.json"
          ).write_text(
              json.dumps(
                  result,
                  indent=2,
                  ensure_ascii=False,
                  default=str,
              ),
              encoding="utf-8",
          )

          if after_raw != before_raw:
              raise SystemExit(
                  "Staging heeft raw_shop_scrapes gewijzigd."
              )

          if after_staged - before_staged != inserted:
              raise SystemExit(
                  "Staged-delta wijkt af van inserted."
              )

          if int(new_stats["new_rows"]) != inserted:
              raise SystemExit(
                  "Aantal nieuwe staged rows wijkt af."
              )

          if int(new_stats["valid_eans"]) != inserted:
              raise SystemExit(
                  "Niet alle staged rows hebben "
                  "een geldige EAN."
              )

          for key in (
              "missing_prices",
              "non_in_stock_rows",
              "staged_image_rows",
              "raw_image_rows",
              "wrong_status_rows",
              "raw_price_mismatches",
              "raw_availability_mismatches",
              "collision_rows",
              "blocked_rows",
          ):
              if int(new_stats[key]) != 0:
                  raise SystemExit(
                      f"Onveilige stagingwrite: "
                      f"{key}={new_stats[key]}"
                  )

          if (
              after_public_prices
              != before_public_prices
          ):
              raise SystemExit(
                  "Staging heeft publieke prijzen gewijzigd."
              )

          print(
              "[OK] Stagingwrite is geïsoleerd en veilig."
          )
          PY

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: colouredvinyl-stage-${{ github.run_id }}
          path: output/usf-colouredvinyl/**
          if-no-files-found: warn
          retention-days: 14
