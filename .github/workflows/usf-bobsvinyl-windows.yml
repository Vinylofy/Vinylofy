name: USF - Bobsvinyl (Windows local)

on:
  schedule:
    - cron: "35 10 * * *"
  workflow_dispatch:
    inputs:
      discovery_max_pages:
        description: "Aantal listingpagina's; 0 = volledige catalogus"
        required: true
        default: "2"
        type: string
      detail_limit:
        description: "Maximaal aantal eligible detailpagina's"
        required: true
        default: "5"
        type: string
      stage_limit:
        description: "Maximaal aantal raw records voor staging"
        required: true
        default: "5"
        type: string
      promote_limit:
        description: "Maximaal aantal staged offers voor promotion"
        required: true
        default: "5"
        type: string
      write:
        description: "Echte databasewrites uitvoeren"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: usf-bobsvinyl-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    name: Run Bobsvinyl USF pipeline on Windows
    runs-on: [self-hosted, Windows, X64, vinylofy-windows]
    timeout-minutes: 180
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PIP_NO_CACHE_DIR: "1"
    steps:
      - name: Verify runner
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          RUNNER_NAME: ${{ runner.name }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'vinylofy-windows-01') { throw "Unexpected runner: $env:RUNNER_NAME" }
          Write-Host "Runner: $env:RUNNER_NAME"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: bobsvinyl
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.15"
          working-directory: ${{ github.workspace }}/bobsvinyl
          enable-cache: false
        env:
          UV_CACHE_DIR: ${{ runner.temp }}/bobsvinyl-uv-cache

      - name: Check and install persistent dependencies
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        working-directory: bobsvinyl
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:LOCALAPPDATA) { throw 'LOCALAPPDATA is required.' }
          $root = Join-Path $env:LOCALAPPDATA 'Vinylofy'
          $env:UV_PYTHON_INSTALL_DIR = Join-Path $root 'bobsvinyl-python'
          $venv = Join-Path $root 'bobsvinyl-venv'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          if (-not (Test-Path -LiteralPath (Join-Path $venv 'Scripts/python.exe'))) {
            Write-Host "Creating persistent Bobsvinyl environment: $venv"
            uv venv --no-project --seed --managed-python --python 3.11 $venv
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else { Write-Host "Reusing persistent Bobsvinyl environment: $venv" }
          $python = Join-Path $venv 'Scripts/python.exe'
          & $python --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $packages = @(
            @{ Name = 'requests'; Import = 'requests' },
            @{ Name = 'beautifulsoup4'; Import = 'bs4' },
            @{ Name = 'psycopg[binary]'; Import = 'psycopg' },
            @{ Name = 'python-dotenv'; Import = 'dotenv' }
          )
          $missing = @()
          foreach ($package in $packages) {
            $previousErrorActionPreference = $ErrorActionPreference
            $ErrorActionPreference = 'Continue'
            & $python -c "import $($package.Import)" 2>$null
            $importExitCode = $LASTEXITCODE
            $ErrorActionPreference = $previousErrorActionPreference
            if ($importExitCode -ne 0) { $missing += $package.Name }
          }
          if ($missing.Count -gt 0) {
            Write-Host "Installing missing packages: $($missing -join ', ')"
            & $python -m pip install @missing
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else { Write-Host 'All Bobsvinyl runtime packages are already available.' }
          $modules = @(
            'scripts/scrapers/bobsvinyl.py',
            'scripts/scrapers/usf/jobs/discover_bobsvinyl.py',
            'scripts/scrapers/usf/jobs/refresh_bobsvinyl_listing_prices.py',
            'scripts/scrapers/usf/jobs/detail_bobsvinyl.py',
            'scripts/scrapers/usf/jobs/run_bobsvinyl_pipeline.py'
          )
          & $python -m py_compile @modules
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m scripts.scrapers.usf.jobs.run_bobsvinyl_pipeline --help *> $null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate configuration
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:DATABASE_URL) { throw 'GitHub secret DATABASE_URL ontbreekt.' }
          Write-Host '[CONFIG] DATABASE_URL is ingesteld.'

      - name: Run Bobsvinyl USF pipeline
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        working-directory: bobsvinyl
        env:
          EVENT_NAME: ${{ github.event_name }}
          WRITE_INPUT: ${{ inputs.write }}
          DISCOVERY_MAX_PAGES_INPUT: ${{ inputs.discovery_max_pages }}
          DETAIL_LIMIT_INPUT: ${{ inputs.detail_limit }}
          STAGE_LIMIT_INPUT: ${{ inputs.stage_limit }}
          PROMOTE_LIMIT_INPUT: ${{ inputs.promote_limit }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:EVENT_NAME -eq 'schedule') {
            $discoveryMaxPages = '0'; $detailLimit = '500'; $stageLimit = '500'; $promoteLimit = '500'; $write = 'true'
          } else {
            $discoveryMaxPages = $env:DISCOVERY_MAX_PAGES_INPUT; $detailLimit = $env:DETAIL_LIMIT_INPUT; $stageLimit = $env:STAGE_LIMIT_INPUT; $promoteLimit = $env:PROMOTE_LIMIT_INPUT; $write = $env:WRITE_INPUT
          }
          $python = Join-Path $env:LOCALAPPDATA 'Vinylofy/bobsvinyl-venv/Scripts/python.exe'
          $args = @('-u', '-m', 'scripts.scrapers.usf.jobs.run_bobsvinyl_pipeline', '--discovery-start-page', '1', '--discovery-max-pages', $discoveryMaxPages, '--detail-limit', $detailLimit, '--stage-limit', $stageLimit, '--promote-limit', $promoteLimit)
          if ($write -eq 'true') { $args += '--write' }
          Write-Host "$python $($args -join ' ')"
          & $python @args
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Clean run-specific uv cache
        if: always()
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $cache = Join-Path $env:RUNNER_TEMP 'bobsvinyl-uv-cache'
          if (Test-Path -LiteralPath $cache) { Remove-Item -LiteralPath $cache -Recurse -Force }
