name: USF - Coloured Vinyl Promote

run-name: >-
  Coloured Vinyl promote • write=${{ inputs.write }} •
  limit=${{ inputs.limit }}

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximumaantal staged offers"
        required: true
        default: "1"
        type: string

      write:
        description: "Schrijf product/prijs/promotiestatus"
        required: true
        default: false
        type: boolean

      minimum_processed:
        description: "Minimaal verwacht aantal promoties"
        required: true
        default: "0"
        type: string

      write_confirmation:
        description: >-
          Bij write=true exact WRITE_COLOUREDVINYL_PROMOTE invullen
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: usf-colouredvinyl-listing-production
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

          if [ -f requirements-scrapers.txt ]; then
            python -m pip install -r requirements-scrapers.txt
          fi

          python -m pip install \
            "psycopg[binary]" \
            python-dotenv

      - name: Validate module
        shell: bash
        run: |
          set -euo pipefail

          python -m py_compile \
            scripts/scrapers/usf/jobs/promote_colouredvinyl.py

          python -m \
            scripts.scrapers.usf.jobs.promote_colouredvinyl \
            --help >/dev/null

          grep -q \
            'raw_payload_artist_title' \
            scripts/scrapers/usf/jobs/promote_colouredvinyl.py

          grep -q \
            'listing_payload\["format"\]' \
            scripts/scrapers/usf/jobs/promote_colouredvinyl.py

          grep -q \
            'shop cover candidate is niet toegestaan' \
            scripts/scrapers/usf/jobs/promote_colouredvinyl.py

      - name: Validate request
        shell: bash
        run: |
          set -euo pipefail

          LIMIT="${{ inputs.limit }}"
          WRITE="${{ inputs.write }}"
          MINIMUM="${{ inputs.minimum_processed }}"
          CONFIRMATION="${{ inputs.write_confirmation }}"

          if ! [[ "$LIMIT" =~ ^[0-9]+$ ]]; then
            echo "[ERROR] limit is ongeldig."
            exit 1
          fi

          if ! [[ "$MINIMUM" =~ ^[0-9]+$ ]]; then
            echo "[ERROR] minimum_processed is ongeldig."
            exit 1
          fi

          if [ "$LIMIT" -lt 1 ] || [ "$LIMIT" -gt 25 ]; then
            echo "[ERROR] limit moet tussen 1 en 25 liggen."
            exit 1
          fi

          if [ "$MINIMUM" -gt "$LIMIT" ]; then
            echo "[ERROR] minimum_processed is groter dan limit."
            exit 1
          fi

          if [ -z "${DATABASE_URL:-}" ]; then
            echo "[ERROR] DATABASE_URL ontbreekt."
            exit 1
          fi

          if [ "$WRITE" = "true" ]; then
            if [ "$CONFIRMATION" != "WRITE_COLOUREDVINYL_PROMOTE" ]; then
              echo "[ERROR] ongeldige writebevestiging."
              exit 1
            fi
          fi

      - name: Capture promotion baseline
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p output/usf-colouredvinyl

          python - <<'PY' \
            2>&1 | tee \
              output/usf-colouredvinyl/promotion-baseline.log
          import json
          import os
          from pathlib import Path

          import psycopg
          from psycopg.rows import dict_row

          from scripts.importers.common import (
              identifier_candidates,
          )


          database_url = os.environ["DATABASE_URL"]

          with psycopg.connect(
              database_url,
              row_factory=dict_row,
          ) as connection:
              with connection.cursor() as cursor:
                  cursor.execute(
                      """
                      select
                        s.id::text as staged_offer_id,
                        s.ean_normalized,
                        s.ean_match_key,
                        s.price,
                        s.currency,
                        s.availability,
                        s.source_url,
                        s.stage_status,
                        r.payload->>'artist' as raw_artist,
                        r.payload->>'title' as raw_title,
                        r.payload->>'format' as raw_format
                      from public.staged_offers s
                      join public.raw_shop_scrapes r
                        on r.id = s.raw_scrape_id
                      where s.shop_id = 'colouredvinyl'
                        and s.stage_status = 'staged'
                      order by
                        s.created_at asc,
                        s.id asc
                      limit 1
                      """
                  )

                  target = cursor.fetchone()

                  if target is None:
                      raise SystemExit(
                          "Geen staged offer beschikbaar."
                      )

                  target = dict(target)

                  identifiers = identifier_candidates(
                      target["ean_match_key"],
                      target["ean_normalized"],
                  )

                  cursor.execute(
                      """
                      select
                        id::text,
                        ean,
                        gtin_normalized,
                        artist,
                        title,
                        format_label,
                        cover_url,
                        metadata_source,
                        metadata_status,
                        metadata_confidence,
                        metadata_needs_review
                      from public.products
                      where ean = any(%s)
                         or gtin_normalized = any(%s)
                      order by
                        updated_at desc nulls last,
                        created_at desc nulls last
                      limit 1
                      """,
                      (
                          identifiers,
                          identifiers,
                      ),
                  )

                  existing_product = cursor.fetchone()

                  if existing_product is not None:
                      existing_product = dict(
                          existing_product
                      )

                  cursor.execute(
                      """
                      select id::text
                      from public.shops
                      where domain = 'colouredvinyl.nl'
                      limit 1
                      """
                  )

                  shop = cursor.fetchone()

                  if shop is None:
                      raise SystemExit(
                          "Coloured Vinyl-shop ontbreekt."
                      )

                  shop_id = shop["id"]

                  existing_price = None
                  history_before = 0

                  if existing_product is not None:
                      cursor.execute(
                          """
                          select
                            product_id::text,
                            price,
                            currency,
                            product_url,
                            availability,
                            is_active
                          from public.prices
                          where product_id = %s
                            and shop_id = %s
                          limit 1
                          """,
                          (
                              existing_product["id"],
                              shop_id,
                          ),
                      )

                      price_row = cursor.fetchone()

                      if price_row is not None:
                          existing_price = dict(
                              price_row
                          )

                      cursor.execute(
                          """
                          select count(*)::int as count
                          from public.price_history
                          where product_id = %s
                            and shop_id = %s
                          """,
                          (
                              existing_product["id"],
                              shop_id,
                          ),
                      )

                      history_before = int(
                          cursor.fetchone()["count"]
                      )

                  cursor.execute(
                      """
                      select
                        (
                          select count(*)::int
                          from public.raw_shop_scrapes
                          where shop_id = 'colouredvinyl'
                        ) as raw_count,
                        (
                          select count(*)::int
                          from public.staged_offers
                          where shop_id = 'colouredvinyl'
                        ) as staged_count,
                        (
                          select count(*)::int
                          from public.staged_offers
                          where shop_id = 'colouredvinyl'
                            and stage_status = 'promoted'
                        ) as promoted_count,
                        (
                          select count(*)::int
                          from public.prices p
                          join public.shops s
                            on s.id = p.shop_id
                          where s.domain = 'colouredvinyl.nl'
                        ) as public_price_count
                      """
                  )

                  counts = dict(
                      cursor.fetchone()
                  )

          baseline = {
              "target": target,
              "identifiers": identifiers,
              "existing_product": existing_product,
              "existing_price": existing_price,
              "history_before": history_before,
              "counts": counts,
          }

          print(
              json.dumps(
                  baseline,
                  indent=2,
                  ensure_ascii=False,
                  default=str,
              )
          )

          if existing_price is not None:
              raise SystemExit(
                  "Voor deze staged offer bestaat al "
                  "een Coloured Vinyl-prijs."
              )

          Path(
              "output/usf-colouredvinyl/"
              "promotion-baseline.json"
          ).write_text(
              json.dumps(
                  baseline,
                  indent=2,
                  ensure_ascii=False,
                  default=str,
              ),
              encoding="utf-8",
          )
          PY

      - name: Run promotion
        shell: bash
        run: |
          set -euo pipefail

          COMMAND=(
            python -u -m
            scripts.scrapers.usf.jobs.promote_colouredvinyl
            --limit "${{ inputs.limit }}"
          )

          if [ "${{ inputs.write }}" = "true" ]; then
            COMMAND+=(--write)
          fi

          printf '[WORKFLOW] Command:'
          printf ' %q' "${COMMAND[@]}"
          printf '\n'

          "${COMMAND[@]}" \
            2>&1 | tee \
              output/usf-colouredvinyl/promotion.log

      - name: Validate diagnostics
        shell: bash
        env:
          INPUT_WRITE: ${{ inputs.write }}
          MINIMUM_PROCESSED: ${{ inputs.minimum_processed }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          from pathlib import Path


          diagnostics = json.loads(
              Path(
                  "output/usf-colouredvinyl/"
                  "promotion-diagnostics.json"
              ).read_text(encoding="utf-8")
          )

          summary = diagnostics["summary"]
          items = diagnostics["items"]

          print(
              json.dumps(
                  diagnostics,
                  indent=2,
                  ensure_ascii=False,
              )
          )

          write_expected = (
              os.environ["INPUT_WRITE"].lower()
              == "true"
          )

          if bool(summary["write"]) != write_expected:
              raise SystemExit(
                  "write-status wijkt af."
              )

          if int(summary["failed"]) != 0:
              raise SystemExit(
                  "Promotie bevat fouten."
              )

          if int(summary["processed"]) < int(
              os.environ["MINIMUM_PROCESSED"]
          ):
              raise SystemExit(
                  "Minder offers gepromoveerd dan verwacht."
              )

          if int(summary["cover_candidates"]) != 0:
              raise SystemExit(
                  "Er is een shopcoverkandidaat geschreven."
              )

          for item in items:
              if item["cover_url"] is not None:
                  raise SystemExit(
                      "Promotierecord bevat cover_url."
                  )

              if item[
                  "cover_candidate_url"
              ] is not None:
                  raise SystemExit(
                      "Promotierecord bevat coverkandidaat."
                  )
          PY

      - name: Verify promotion database write
        if: ${{ always() && inputs.write }}
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY' \
            2>&1 | tee \
              output/usf-colouredvinyl/promotion-database-verification.log
          import json
          import os
          from pathlib import Path

          import psycopg
          from psycopg.rows import dict_row


          baseline = json.loads(
              Path(
                  "output/usf-colouredvinyl/"
                  "promotion-baseline.json"
              ).read_text(encoding="utf-8")
          )

          diagnostics = json.loads(
              Path(
                  "output/usf-colouredvinyl/"
                  "promotion-diagnostics.json"
              ).read_text(encoding="utf-8")
          )

          summary = diagnostics["summary"]
          items = diagnostics["items"]
          target = baseline["target"]
          identifiers = baseline["identifiers"]

          database_url = os.environ["DATABASE_URL"]

          with psycopg.connect(
              database_url,
              row_factory=dict_row,
          ) as connection:
              with connection.cursor() as cursor:
                  cursor.execute(
                      """
                      select
                        stage_status,
                        stage_reason
                      from public.staged_offers
                      where id = %s
                      """,
                      (
                          target["staged_offer_id"],
                      ),
                  )

                  staged_after = cursor.fetchone()

                  cursor.execute(
                      """
                      select
                        id::text,
                        ean,
                        gtin_normalized,
                        artist,
                        title,
                        format_label,
                        cover_url,
                        metadata_source,
                        metadata_status,
                        metadata_confidence,
                        metadata_needs_review
                      from public.products
                      where ean = any(%s)
                         or gtin_normalized = any(%s)
                      order by
                        updated_at desc nulls last,
                        created_at desc nulls last
                      """,
                      (
                          identifiers,
                          identifiers,
                      ),
                  )

                  products_after = [
                      dict(row)
                      for row in cursor.fetchall()
                  ]

                  if len(products_after) != 1:
                      raise SystemExit(
                          "Na promotie bestaat niet exact "
                          "één canoniek product voor de EAN."
                      )

                  product = products_after[0]

                  cursor.execute(
                      """
                      select
                        p.product_id::text,
                        p.price,
                        p.currency,
                        p.product_url,
                        p.availability,
                        p.is_active
                      from public.prices p
                      join public.shops s
                        on s.id = p.shop_id
                      where s.domain = 'colouredvinyl.nl'
                        and p.product_id = %s
                      """,
                      (
                          product["id"],
                      ),
                  )

                  prices_after = [
                      dict(row)
                      for row in cursor.fetchall()
                  ]

                  cursor.execute(
                      """
                      select count(*)::int as count
                      from public.price_history h
                      join public.shops s
                        on s.id = h.shop_id
                      where s.domain = 'colouredvinyl.nl'
                        and h.product_id = %s
                      """,
                      (
                          product["id"],
                      ),
                  )

                  history_after = int(
                      cursor.fetchone()["count"]
                  )

                  cursor.execute(
                      """
                      select
                        (
                          select count(*)::int
                          from public.raw_shop_scrapes
                          where shop_id = 'colouredvinyl'
                        ) as raw_count,
                        (
                          select count(*)::int
                          from public.staged_offers
                          where shop_id = 'colouredvinyl'
                        ) as staged_count,
                        (
                          select count(*)::int
                          from public.staged_offers
                          where shop_id = 'colouredvinyl'
                            and stage_status = 'promoted'
                        ) as promoted_count,
                        (
                          select count(*)::int
                          from public.prices p
                          join public.shops s
                            on s.id = p.shop_id
                          where s.domain = 'colouredvinyl.nl'
                        ) as public_price_count
                      """
                  )

                  counts_after = dict(
                      cursor.fetchone()
                  )

          result = {
              "summary": summary,
              "baseline": baseline,
              "staged_after": (
                  dict(staged_after)
                  if staged_after is not None
                  else None
              ),
              "product_after": product,
              "prices_after": prices_after,
              "history_after": history_after,
              "counts_after": counts_after,
          }

          print(
              json.dumps(
                  result,
                  indent=2,
                  ensure_ascii=False,
                  default=str,
              )
          )

          Path(
              "output/usf-colouredvinyl/"
              "promotion-database-verification.json"
          ).write_text(
              json.dumps(
                  result,
                  indent=2,
                  ensure_ascii=False,
                  default=str,
              ),
              encoding="utf-8",
          )

          if summary != {
              "shop": "colouredvinyl",
              "queued": 1,
              "processed": 1,
              "failed": 0,
              "new_products": (
                  0
                  if baseline["existing_product"]
                  else 1
              ),
              "new_prices": 1,
              "changed_prices": 0,
              "history_rows": 1,
              "cover_candidates": 0,
              "write": True,
          }:
              raise SystemExit(
                  "Onverwachte promotiesamenvatting."
              )

          if staged_after is None:
              raise SystemExit(
                  "Staged offer is verdwenen."
              )

          if staged_after[
              "stage_status"
          ] != "promoted":
              raise SystemExit(
                  "Staged offer is niet promoted."
              )

          if staged_after[
              "stage_reason"
          ] is not None:
              raise SystemExit(
                  "Promoted offer heeft stage_reason."
              )

          if len(prices_after) != 1:
              raise SystemExit(
                  "Niet exact één Coloured Vinyl-prijs."
              )

          price = prices_after[0]

          if float(price["price"]) != float(
              target["price"]
          ):
              raise SystemExit(
                  "Publieke prijs wijkt af."
              )

          if price["currency"] != target["currency"]:
              raise SystemExit(
                  "Valuta wijkt af."
              )

          if price["product_url"] != target["source_url"]:
              raise SystemExit(
                  "Publieke product-URL wijkt af."
              )

          if (
              price["availability"]
              != target["availability"]
          ):
              raise SystemExit(
                  "Publieke voorraad wijkt af."
              )

          if price["is_active"] is not True:
              raise SystemExit(
                  "Publieke prijs is niet actief."
              )

          existing = baseline[
              "existing_product"
          ]

          if existing is None:
              if product["artist"] != target["raw_artist"]:
                  raise SystemExit(
                      "Nieuw product heeft verkeerde artiest."
                  )

              if product["title"] != target["raw_title"]:
                  raise SystemExit(
                      "Nieuw product heeft verkeerde titel."
                  )

              if (
                  product["format_label"]
                  != target["raw_format"]
              ):
                  raise SystemExit(
                      "Nieuw product heeft verkeerd formaat."
                  )

              if product["cover_url"] is not None:
                  raise SystemExit(
                      "Nieuw product bevat shopcover."
                  )

              if (
                  product["metadata_source"]
                  != "shop_observed"
              ):
                  raise SystemExit(
                      "Nieuw product mist placeholderbron."
                  )

              if (
                  product["metadata_status"]
                  != "placeholder"
              ):
                  raise SystemExit(
                      "Nieuw product mist placeholderstatus."
                  )

              if int(
                  product["metadata_confidence"]
              ) != 30:
                  raise SystemExit(
                      "Nieuw product heeft verkeerde confidence."
                  )

              if (
                  product[
                      "metadata_needs_review"
                  ]
                  is not True
              ):
                  raise SystemExit(
                      "Nieuw product moet review vereisen."
                  )
          else:
              if product["id"] != existing["id"]:
                  raise SystemExit(
                      "Promotie koppelde aan verkeerd product."
                  )

              for field in (
                  "artist",
                  "title",
                  "format_label",
                  "cover_url",
                  "metadata_source",
                  "metadata_status",
                  "metadata_confidence",
                  "metadata_needs_review",
              ):
                  before = existing.get(field)
                  after = product.get(field)

                  if before not in (
                      None,
                      "",
                  ) and after != before:
                      raise SystemExit(
                          "Bestaande canonieke metadata "
                          f"is overschreven: {field}"
                      )

          if history_after - int(
              baseline["history_before"]
          ) != 1:
              raise SystemExit(
                  "Prijshistoriedelta is niet één."
              )

          before_counts = baseline["counts"]

          if (
              counts_after["raw_count"]
              != before_counts["raw_count"]
          ):
              raise SystemExit(
                  "Promotie wijzigde raw snapshots."
              )

          if (
              counts_after["staged_count"]
              != before_counts["staged_count"]
          ):
              raise SystemExit(
                  "Promotie wijzigde aantal staged offers."
              )

          if (
              counts_after["promoted_count"]
              - before_counts["promoted_count"]
              != 1
          ):
              raise SystemExit(
                  "Promoted-delta is niet één."
              )

          if (
              counts_after["public_price_count"]
              - before_counts["public_price_count"]
              != 1
          ):
              raise SystemExit(
                  "Publieke prijsdelta is niet één."
              )

          if len(items) != 1:
              raise SystemExit(
                  "Diagnostics bevatten niet exact één item."
              )

          item = items[0]

          if item["artist"] != target["raw_artist"]:
              raise SystemExit(
                  "Promotierecord heeft verkeerde artiest."
              )

          if item["title"] != target["raw_title"]:
              raise SystemExit(
                  "Promotierecord heeft verkeerde titel."
              )

          if (
              item["format_label"]
              != target["raw_format"]
          ):
              raise SystemExit(
                  "Promotierecord heeft verkeerd formaat."
              )

          if item["cover_url"] is not None:
              raise SystemExit(
                  "Promotierecord bevat cover."
              )

          if item[
              "cover_candidate_url"
          ] is not None:
              raise SystemExit(
                  "Promotierecord bevat coverkandidaat."
              )

          print(
              "[OK] Eerste Coloured Vinyl-promotie "
              "is atomair en veilig."
          )
          PY

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: colouredvinyl-promote-${{ github.run_id }}
          path: output/usf-colouredvinyl/**
          if-no-files-found: warn
          retention-days: 14
