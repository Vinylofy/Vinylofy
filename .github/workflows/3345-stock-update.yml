name: USF - 3345 Stock Batched

on:
  schedule:
    - cron: "17 2,10,18 * * *"

  workflow_dispatch:
    inputs:
      pages:
        description: "Maximumaantal pagina's"
        required: true
        default: "3"
        type: string

      write:
        description: "Databasewrites uitvoeren"
        required: true
        default: false
        type: boolean

      reset_cycle:
        description: "Opnieuw beginnen op pagina 1"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: usf-shop3345-production
  cancel-in-progress: false

jobs:
  stock:
    name: Run resumable 3345 stock batch
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

          if [ -f requirements-scrapers.txt ]; then
            pip install -r requirements-scrapers.txt
          fi

          pip install \
            requests \
            beautifulsoup4 \
            playwright \
            "psycopg[binary]" \
            python-dotenv

          python -m playwright install \
            --with-deps chromium

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${DATABASE_URL:-}" ]; then
            echo "[ERROR] DATABASE_URL ontbreekt."
            exit 1
          fi

          python -m py_compile \
            scripts/scrapers/usf/stock_shop3345.py \
            scripts/scrapers/usf/jobs/run_shop3345_stock_batches.py

          python -m \
            scripts.scrapers.usf.stock_shop3345 \
            --help >/dev/null

          python -m \
            scripts.scrapers.usf.jobs.run_shop3345_stock_batches \
            --help >/dev/null

      - name: Run stock batch
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "schedule" ]; then
            PAGES="50"
            WRITE="true"
            RESET="false"
          else
            PAGES="${{ inputs.pages }}"
            WRITE="${{ inputs.write }}"
            RESET="${{ inputs.reset_cycle }}"
          fi

          COMMAND=(
            python
            -u
            -m
            scripts.scrapers.usf.jobs.run_shop3345_stock_batches
            --pages "$PAGES"
            --page-sleep 10
            --wait-ms 5000
            --retries 6
            --output-dir output/usf-shop3345-stock
          )

          if [ "$WRITE" = "true" ]; then
            COMMAND+=(--write)
          fi

          if [ "$RESET" = "true" ]; then
            COMMAND+=(--reset-cycle)
          fi

          printf '[WORKFLOW] Command:'
          printf ' %q' "${COMMAND[@]}"
          printf '\n'

          "${COMMAND[@]}"

      - name: Upload logs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usf-shop3345-stock-${{ github.run_id }}
          path: output/usf-shop3345-stock/**
          if-no-files-found: warn
          retention-days: 14
