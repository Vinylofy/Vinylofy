name: USF - Variaworld

on:
  schedule:
    - cron: "20 2 * * *"
    - cron: "50 2 * * 2,5"
  workflow_dispatch:
    inputs:
      listing_max_pages:
        description: "Aantal listingpagina's per seed; 0 = tot stopconditie"
        required: true
        default: "0"
        type: string
      price_only:
        description: "Alleen listing refresh + fast price sync"
        required: true
        default: true
        type: boolean
      detail_limit:
        description: "Maximaal aantal detailpagina's"
        required: true
        default: "500"
        type: string
      write:
        description: "Werkelijke databasewrites uitvoeren"
        required: true
        default: true
        type: boolean

concurrency:
  group: usf-variaworld-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    name: Run Variaworld USF
    # Variaworld geo-blocks GitHub-hosted runner IPs; use the NL/EU self-hosted runner.
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 180

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi
          if [ -f requirements-scrapers.txt ]; then
            python -m pip install -r requirements-scrapers.txt
          fi
          python -m pip install requests beautifulsoup4 "psycopg[binary]" python-dotenv

      - name: Run pipeline
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            LISTING_MAX_PAGES="${{ inputs.listing_max_pages }}"
            PRICE_ONLY="${{ inputs.price_only }}"
            DETAIL_LIMIT="${{ inputs.detail_limit }}"
            WRITE="${{ inputs.write }}"
          elif [[ "${{ github.event.schedule }}" == "50 2 * * 2,5" ]]; then
            LISTING_MAX_PAGES="0"
            PRICE_ONLY="false"
            DETAIL_LIMIT="500"
            WRITE="true"
          else
            LISTING_MAX_PAGES="0"
            PRICE_ONLY="true"
            DETAIL_LIMIT="0"
            WRITE="true"
          fi

          cmd=(
            python -u -m scripts.scrapers.usf.jobs.run_variaworld_pipeline
            --listing-start-page 1
            --listing-max-pages "${LISTING_MAX_PAGES}"
            --listing-sleep 0.30
            --fast-price-sync
            --detail-limit "${DETAIL_LIMIT}"
            --stage-limit "${DETAIL_LIMIT}"
            --promote-limit "${DETAIL_LIMIT}"
            --quarantine-limit "${DETAIL_LIMIT}"
          )

          if [[ "${WRITE}" == "true" ]]; then
            cmd+=(--write)
          fi

          if [[ "${PRICE_ONLY}" == "true" ]]; then
            cmd+=(--skip-detail --skip-stage --skip-promote --skip-quarantine)
          fi

          echo "${cmd[@]}"
          "${cmd[@]}"
