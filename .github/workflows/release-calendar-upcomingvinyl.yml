name: Release Calendar - UpcomingVinyl

on:
  workflow_dispatch:
    inputs:
      write:
        description: "Write to Supabase"
        required: true
        default: "true"
        type: choice
        options:
          - "false"
          - "true"
      max_pages:
        description: "Max UpcomingVinyl listing pages"
        required: true
        default: "50"
      delay_seconds:
        description: "Wachttijd tussen UpcomingVinyl listingpagina's"
        required: true
        default: "1.0"

  schedule:
    - cron: "35 6 * * 1"

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "requests" "beautifulsoup4" "psycopg[binary]" "python-dotenv"

      - name: Compile UpcomingVinyl release discovery
        run: |
          python -m py_compile \
            scripts/release_discovery/jobs/discover_upcomingvinyl.py

      - name: Discover UpcomingVinyl releases
        run: |
          WRITE_FLAG=""
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.write }}" = "true" ]; then
            WRITE_FLAG="--write"
          fi

          python -m scripts.release_discovery.jobs.discover_upcomingvinyl \
            --max-pages "${{ inputs.max_pages || '50' }}" \
            --sleep "${{ inputs.delay_seconds || '1.0' }}" \
            $WRITE_FLAG
