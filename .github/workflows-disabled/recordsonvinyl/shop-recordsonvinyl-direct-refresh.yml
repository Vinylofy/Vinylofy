name: Shop - RecordsOnVinyl Direct Refresh

on:
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Max pagina's (0 = tot uitgeput)"
        required: false
        default: "0"
      limit_products:
        description: "Max listing items om te verwerken (0 = geen limiet)"
        required: false
        default: "0"
      dry_run:
        description: "Alleen testen, geen database writes"
        required: false
        default: "false"
permissions:
  contents: read
  actions: read

concurrency:
  group: vinylofy-recordsonvinyl
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-scrapers.txt ]; then pip install -r requirements-scrapers.txt; fi
          pip install beautifulsoup4 requests "psycopg[binary]" python-dotenv

      - name: Create runtime folders
        shell: bash
        run: |
          mkdir -p data/raw/recordsonvinyl
          mkdir -p output

      - name: Restore latest RecordsOnVinyl state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -u scripts/automation/restore_latest_state_artifact.py \
            --repo "${{ github.repository }}" \
            --target-dir data/raw/recordsonvinyl \
            --artifact-prefix recordsonvinyl-state- \
            --workflow-name "Shop - RecordsOnVinyl Refresh" \
            --workflow-name "Shop - RecordsOnVinyl Crawl" || true

          echo "Restored files:"
          ls -la data/raw/recordsonvinyl || true

      - name: Run direct RecordsOnVinyl price refresh
        shell: bash
        run: |
          set -euo pipefail

          MAX_PAGES="${{ github.event.inputs.max_pages }}"
          LIMIT_PRODUCTS="${{ github.event.inputs.limit_products }}"
          DRY_RUN="${{ github.event.inputs.dry_run }}"

          [ -n "$MAX_PAGES" ] || MAX_PAGES="0"
          [ -n "$LIMIT_PRODUCTS" ] || LIMIT_PRODUCTS="0"
          [ -n "$DRY_RUN" ] || DRY_RUN="false"

          EXTRA_ARGS=""
          if [ "$DRY_RUN" = "true" ]; then
            EXTRA_ARGS="--dry-run"
          fi

          python -u scripts/scrapers/recordsonvinyl_direct_refresh.py \
            --master-csv data/raw/recordsonvinyl/recordsonvinyl_master.csv \
            --max-pages "${MAX_PAGES}" \
            --limit-products "${LIMIT_PRODUCTS}" \
            --out output/recordsonvinyl_direct_refresh_audit.csv \
            --snapshot output/recordsonvinyl_direct_refresh_snapshot.csv \
            ${EXTRA_ARGS}

      - name: Upload direct refresh artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: recordsonvinyl-direct-refresh-${{ github.run_id }}
          path: |
            output/**/*.csv
            output/**/*.json
            data/raw/recordsonvinyl/*.csv
          if-no-files-found: warn
